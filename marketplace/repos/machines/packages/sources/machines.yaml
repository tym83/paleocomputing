# The "machines" repository: emulators of systems missing from the main catalog.
#
# The unit of installation in the marketplace model is a whole repository, not a
# single package: the things inside are built and tested together. A repository
# is one OCI artifact with its own tag, and the tag is its version.
#
# There is exactly one variant. The chart reference name is built as
# <source>-<variant>-<component>, so a second variant would send all
# ApplicationDefinition references to non-existent artifacts. All 100 sources of
# the platform itself also have exactly one variant.
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: paleocomputing.machines
spec:
  sourceRef:
    kind: OCIRepository
    name: paleocomputing-machines
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        # This provides the CRD for the ApplicationDefinition rendered by the
        # machines-rd component below.
        - cozystack.cozystack-engine
      # Shared templates for machines of foreign architectures. The platform
      # puts the library into charts/ of every component that names it
      # (internal/operator/packagesource_reconciler.go), the same way as its own
      # cozy-lib. In the tree the charts/retro-machine link points at it, so that
      # helm template and the checks see what the platform will assemble.
      libraries:
        - name: retro-machine
          path: library/retro-machine
      components:
        # A component without an install block is published as an artifact and
        # NOT installed as a release (internal/operator/package_reconciler.go:
        # "Skip components without Install section"). That is exactly what
        # applications need: the user deploys them from the catalog, not the
        # repository connection.
        - name: oberon-lab
          path: apps/oberon-lab
        - name: handbook
          path: apps/handbook
        - name: workbench
          path: apps/workbench
        # The air between machines: a relay for their radios (Net.Mod).
        - name: oberon-air
          path: apps/oberon-air
        # A machine = a machine.yaml passport + a form; templates come from the library.
        - name: oberon-vm
          path: apps/oberon-vm
          libraries: ["retro-machine"]

        # The catalog application definitions, however, are installed once.
        - name: machines-rd
          path: system/machines-rd
          install:
            namespace: cozy-system
            releaseName: forgotten-machines-rd
