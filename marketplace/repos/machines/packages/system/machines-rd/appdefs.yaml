# What this repository shows in the Cozystack catalog.
#
# Application schemas are not copied here: the generator takes them directly
# from the values.schema.json of the corresponding chart.
packageSource: paleocomputing.machines
variant: default
artifactNamespace: cozy-system

apps:
  - component: oberon-lab
    chartPath: apps/oberon-lab
    kind: OberonLab
    plural: oberonlabs
    singular: oberonlab
    prefix: oberon-lab-
    dashboard:
      singular: Oberon Lab
      plural: Oberon Labs
      category: Paleocomputing
      description: Oberon on Wirth's own Verilog, in the browser — thirteen labs and a handbook
      icon: logos/oberon-lab.svg
      tags: [paleocomputing, education, emulation, retrocomputing, machine]
      keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "web"], ["spec", "replicas"], ["spec", "host"], ["spec", "runner"], ["spec", "task"], ["spec", "patch"]]

  - component: oberon-air
    chartPath: apps/oberon-air
    kind: OberonAir
    plural: oberonairs
    singular: oberonair
    prefix: oberon-air-
    dashboard:
      singular: Oberon Air
      plural: Oberon Airs
      category: Paleocomputing
      description: The air between Oberon machines — Wirth's radio network, so machines can talk over Net
      icon: logos/oberon-air.svg
      tags: [paleocomputing, networking, emulation, retrocomputing]
      keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "image"]]

  - component: handbook
    chartPath: apps/handbook
    kind: Handbook
    plural: handbooks
    singular: handbook
    prefix: handbook-
    dashboard:
      singular: Handbook
      plural: Handbooks
      category: Paleocomputing
      description: Documentation served next to the application it documents
      icon: logos/handbook.svg
      tags: [paleocomputing, documentation, education]
      keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "title"], ["spec", "pages"], ["spec", "image"], ["spec", "host"]]

  - component: workbench
    chartPath: apps/workbench
    kind: Workbench
    plural: workbenches
    singular: workbench
    prefix: workbench-
    dashboard:
      singular: Workbench
      plural: Workbenches
      category: Paleocomputing
      description: The Wirth machine, its labs and its handbook installed as one thing
      icon: logos/workbench.svg
      tags: [paleocomputing, environment, meta, education]
      weight: 10
      keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "machine"], ["spec", "manual"], ["spec", "host"], ["spec", "manualHost"]]

  # The RISC5 machine as a VM. It differs from the lab fundamentally:
  # there it is a browser and a circuit simulation, here a real virtual machine
  # of the cluster with its own architecture.
  - component: oberon-vm
    chartPath: apps/oberon-vm
    kind: OberonVM
    plural: oberonvms
    singular: oberonvm
    prefix: oberon-vm-
    dashboard:
      singular: Oberon VM
      plural: Oberon VMs
      category: Paleocomputing
      description: Wirth's RISC5 as a real virtual machine, an architecture KubeVirt does not have
      icon: logos/oberon-vm.svg
      tags: [paleocomputing, machine, kubevirt, architecture, retrocomputing]
      weight: 20
      keysOrder: [["apiVersion"], ["kind"], ["metadata"], ["metadata", "name"], ["spec", "memory"], ["spec", "running"], ["spec", "hardware"], ["spec", "storageClass"], ["spec", "storage"]]
