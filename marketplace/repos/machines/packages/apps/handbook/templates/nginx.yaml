{{- if not .Values.image }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
  labels: {{- include "handbook.labels" . | nindent 4 }}
# ⚠ worker_processes is pinned to one on purpose.
#
# The stock image has auto, and nginx starts a worker for every core of the
# NODE, not of the allotted limit. On a 96-core node that is 96 processes; they
# do not fit into 64Mi, and the pod goes into an endless OOM restart loop.
# Found on a live cluster: the HelmRelease succeeded, the application was dead.
#
# The image's stock auto-tuning script does not help here: it edits
# /etc/nginx/nginx.conf, but our container root is read-only, and the script
# exits silently. So the whole configuration is supplied.
#
# Serving static files does not need more than one worker anyway: the network is the bottleneck.
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log notice;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      proxy_temp_path      /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path    /tmp/fastcgi_temp;
      uwsgi_temp_path      /tmp/uwsgi_temp;
      scgi_temp_path       /tmp/scgi_temp;

      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
      }
    }
{{- end }}
