##
## @section What the environment is made of
##
## A meta-application: the user installs one thing and gets an environment of
## several parts. The parts are the same components of the repository, so they
## are not duplicated: the parent release only orders them by artifact reference.

## @param {bool} machine=true - Machine with the labs.
machine: true

## @param {bool} manual=true - Manual next to the machine.
manual: true

## @param {string} [host] - External host name of the machine. Empty means no ingress is created.
host: ""

## @param {string} [manualHost] - External host name of the manual.
manualHost: ""

## @param {string} [ingressClassName] - Ingress class. Empty means the cluster default.
ingressClassName: ""

##
## @section Where the chart references point
##
## The artifact name is built as <source>-<variant>-<component>, with dots
## replaced by hyphens (internal/marketplace/naming). These values need changing
## only if the repository is renamed.

## @param {string} artifactPrefix=paleocomputing-machines-default - Common
## prefix of this repository's artifact names.
artifactPrefix: paleocomputing-machines-default

## @param {string} artifactNamespace=cozy-system - Namespace that holds the
## artifacts of the connected repository.
artifactNamespace: cozy-system

## @typedef {struct} Manual - What the manual shows.
## @field {string} title - Title.
## @field {string} image - Image with ready documentation; empty means pages are used.

## @param {Manual} manualSource - Source of the manual.
manualSource:
  title: "Oberon on real Verilog"
  image: ""
