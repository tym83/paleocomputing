{{- if and (not .Values.machine) (not .Values.manual) }}
{{- fail "workbench: an environment without a single part makes no sense; enable machine or manual" }}
{{- end }}
{{- if .Values.machine }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-machine
  labels:
    {{- include "workbench.labels" . | nindent 4 }}
spec:
  chartRef:
    kind: ExternalArtifact
    name: {{ include "workbench.artifact" (dict "root" $ "component" "oberon-lab") }}
    namespace: {{ .Values.artifactNamespace | quote }}
  interval: 5m
  timeout: 15m
  values:
    web: true
    runner: false
    host: {{ .Values.host | quote }}
    ingressClassName: {{ .Values.ingressClassName | quote }}
{{- end }}
{{- if .Values.manual }}
{{- if .Values.machine }}
---
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-manual
  labels:
    {{- include "workbench.labels" . | nindent 4 }}
spec:
  chartRef:
    kind: ExternalArtifact
    name: {{ include "workbench.artifact" (dict "root" $ "component" "handbook") }}
    namespace: {{ .Values.artifactNamespace | quote }}
  interval: 5m
  timeout: 15m
  {{- /* The manual is installed together with the machine. If the catalog
         entry has no image of its own with documentation, the environment
         still comes up: a start page is served. */}}
  values:
    title: {{ .Values.manualSource.title | quote }}
    image: {{ .Values.manualSource.image | quote }}
    host: {{ .Values.manualHost | quote }}
    ingressClassName: {{ .Values.ingressClassName | quote }}
    {{- if not .Values.manualSource.image }}
    pages:
      - name: start
        title: "Getting started"
        body: |
          This environment brought up a machine and a manual next to it.

          Machine: nine browser labs, the CPU is compiled to WASM.
          It opens at /lab.html on the machine host.

          Manual: served here. The catalog entry has no documentation image
          of its own, so this start page is shown instead;
          set an image in manualSource.image or your own pages list.
    {{- end }}
{{- end }}
