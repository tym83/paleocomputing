##
## @section Машина
##
## Архитектура, эмулятор, файлы машины и её варианты железа — не здесь, а в
## паспорте machine.yaml: их меняет выпуск каталога, а не тенант.

## @param {string} memory=128Mi - Сколько памяти отдать машине.
## Самой машине Вирта хватает шестнадцати мегабайт: больше её адресная шина
## не видит. Остальное уходит на обвязку KubeVirt. Пределы — в паспорте
## машины: от 128Mi до 1Gi.
memory: 128Mi

## @param {boolean} running=true - Держать машину запущенной.
## false — машина остановлена (стратегия запуска Halted), том с системой и
## файлами пользователя остаётся.
running: true

## @param {string} hardware=base - Вариант железа: `base` или `chk`.
## `chk` включает аппаратную проверку границ массива — ту самую команду, ради
## которой всё и затевалось. Это НЕ режим эмулятора, а другая сборка
## процессора: в RTL она включается -DWITH_CHK, а на странице проекта тем же
## переключателем меняется модель под системой. Стоковая система работает на
## обоих одинаково. Новый вариант вступает в силу с перезапуском машины.
hardware: base

##
## @section Хранилище
##

## @param {string} storageClass=replicated - Класс тома под ПЗУ и образ.
storageClass: replicated

## @param {string} storage=1Gi - Размер тома.
## Система Оберон занимает меньше мегабайта: запас здесь чисто символический.
storage: 1Gi
