##
## @section Machine
##
## The architecture, emulator, machine files and hardware variants are not here
## but in the machine.yaml passport: they are changed by a catalog release, not by the tenant.

## @param {string} memory=128Mi - How much memory to give the machine.
## Wirth's machine itself needs sixteen megabytes: its address bus sees no more.
## The rest goes to KubeVirt overhead. The limits are in the machine passport:
## from 128Mi to 1Gi.
memory: 128Mi

## @param {boolean} running=true - Keep the machine running.
## false means the machine is stopped (run strategy Halted); the volume with the
## system and the user's files stays.
running: true

## @param {string} hardware=base - Hardware variant: `base` or `chk`.
## `chk` enables hardware array bounds checking, the very instruction the whole
## thing was started for. This is NOT an emulator mode but a different CPU
## build: in RTL it is enabled by -DWITH_CHK, and on the project page the same
## switch changes the model under the system. The stock system runs the same on
## both. A new variant takes effect when the machine restarts.
hardware: base

##
## @section Storage
##

## @param {string} storageClass=replicated - Storage class of the volume for the ROM and the image.
storageClass: replicated

## @param {string} storage=1Gi - Volume size.
## The Oberon system takes less than a megabyte: the headroom here is purely symbolic.
storage: 1Gi

##
## @section Radio
##

## @param {string} air - Name of an OberonAir in this tenant to join; empty for none.
## The machine's radio (SCC.Mod, Net.Mod) then reaches every other machine on
## the same air, and Net.SendMsg, Net.SendFiles and Kube nodes work between them.
air: ""

##
## @section Kube
##

## @param {string} kubeRole - Role of this machine in a Kube cluster: `plane`, `node`, or empty for none.
## Kube is the Kubernetes control plane written in Oberon (impl/kube); its
## nodes talk over the radio, so the machine needs an air. A plane runs
## Kube.Start and KubeNet.Serve at start, a node KubeNet.Join: the cluster
## forms itself, nothing has to be typed. The plane keeps its objects on its
## disk; apply deployments on it over VNC, e.g. Kube.Apply web 4 Ticker, or let
## `commands` apply one at every start with Kube.Apply web 4 Ticker (the
## commands win after a restart) or create it once with Kube.Ensure.
kubeRole: ""

## @param {string} kubeCluster=kube - Name of the Kube cluster, up to 8 characters.
## Several clusters can share one air; a node obeys only its own cluster.
kubeCluster: kube

## @param {string} kubeNode - Name of this node, up to 6 characters (role `node`).
kubeNode: ""

## @param {string} kubeKey - Key of the cluster, up to 16 hex digits.
## Every message on the air is signed with it, and a node obeys only messages
## signed with its cluster's key. The same key on the plane and on every node.
kubeKey: ""

##
## @section Start
##

## @param {string} commands - Oberon commands to run at start, separated by `;`.
## Run after the Kube role's commands, e.g. `Ticker.Show` or `Hilbert.Draw`.
## Up to 240 characters in all.
commands: ""

