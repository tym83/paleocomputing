{{/*
  Уборка после удаления машины.

  Том и задача наполнения — хуки установки (см. payload.yaml), а ресурсы
  хуков Helm при удалении релиза не трогает. Без уборки каждая удалённая
  машина оставляла в тенанте том на гигабайт и отработавшую задачу, и
  повторная установка под тем же именем упиралась в старый том.

  Удаляет их задача post-delete. Всё, что ей нужно, — тоже хуки post-delete:
  обычным ресурсом права пропали бы раньше, чем задача запустится.

  ⚠ Три правила, каждое оплачено зависанием удаления:
    * удаляем по ИМЕНАМ, без выборки по меткам — чужого не заденем;
    * --wait=false: том держит финализатор, пока жив под машины, и ждать его
      значит ждать под, который удаляется параллельно;
    * activeDeadlineSeconds: задача, которая не может закончиться (нет
      образа, нет прав), иначе держит удаление релиза бесконечно.
*/}}
{{- $fullname := include "oberon-vm.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-cleanup
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    # Права раньше задачи: у них вес меньше.
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-cleanup
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
# Только эти два ресурса и только по имени: задача не может удалить в тенанте
# ничего, кроме того, что оставила сама машина.
- apiGroups: [""]
  resources: [persistentvolumeclaims]
  resourceNames: [{{ $fullname }}-payload]
  verbs: [get, delete]
- apiGroups: [batch]
  resources: [jobs]
  resourceNames: [{{ $fullname }}-fill]
  verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-cleanup
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ $fullname }}-cleanup
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-cleanup
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    # Упавшая задача остаётся, чтобы было что смотреть; повторное удаление
    # уберёт её через before-hook-creation.
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "oberon-vm.labels" . | nindent 8 }}
        # ⚠ Без этой метки под тенанта до kube-apiserver не достучится: политика
        # Cozystack allow-to-apiserver пускает только помеченные поды, прочих
        # Cilium молча отбрасывает. kubectl тогда висит до activeDeadlineSeconds,
        # удаление приложения падает, том остаётся. Найдено в живом тенанте —
        # helm template и локальный прогон этого не видят.
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-cleanup
      # Тенант живёт под ограничениями restricted: не root, без повышения
      # прав, без возможностей ядра. Образ kubectl запускается от root по
      # умолчанию, поэтому пользователь задан явно.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cleanup
        # Прибит дайджестом: задача запускается раз в жизни машины, и узнать,
        # что образ пропал или подменён, в этот момент уже поздно.
        image: registry.k8s.io/kubectl:v1.35.9@sha256:436cbaa8a019152063d638f412cf9d73ec29e56061529d28cbc231c6ab1b37a4
        command: [/bin/kubectl]
        args:
          - delete
          - --namespace={{ .Release.Namespace }}
          - --ignore-not-found
          - --wait=false
          - persistentvolumeclaim/{{ $fullname }}-payload
          - job/{{ $fullname }}-fill
        # kubectl складывает кэш API в $HOME/.kube, а корень только для чтения.
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      volumes:
      - name: tmp
        emptyDir: {}
