{{/*
  Том с ПЗУ и образом системы.

  Машине неоткуда взять ни то, ни другое: у неё нет ни микропрограммы в
  привычном смысле, ни сети. Том наполняется разовой задачей из образа с
  эмулятором и монтируется И в перехватчик, И в контейнер с libvirt — за это
  отвечает sharedComputePath в объявлении перехватчика.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oberon-vm.fullname" . }}-payload
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    # Том создаётся ПЕРЕД машиной: ей неоткуда взять ни ПЗУ, ни систему, и
    # без них она просто не заведётся.
    #
    # ⚠ Только при установке. Раньше здесь стояло и pre-upgrade «без политики
    # удаления» — но без политики Helm применяет before-hook-creation, то есть
    # на каждом обновлении удаляет том, чтобы создать заново. Том занят
    # работающей машиной, зависает в Terminating, и обновление висит до
    # таймаута. Найдено первым же обновлением каталога поверх живых машин.
    #
    # Цена: ресурсы хуков Helm не удаляет при удалении релиза — том остаётся
    # и убирается вручную.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oberon-vm.fullname" . }}-fill
  labels: {{- include "oberon-vm.labels" . | nindent 4 }}
  annotations:
    # ⚠ Задача должна отработать ДО запуска машины. Обычным ресурсом это не
    # выходит: Helm не ждёт её, и машина стартует с пустым томом.
    #
    # Только при установке: на обновлении она перезаписала бы oberon.dsk под
    # работающей системой — это диск пользователя, а не прошивка.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "oberon-vm.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # ⚠ Образ работает от непривилегированного пользователя, а том приходит
      # принадлежащим root — записать в него нечего. fsGroup отдаёт том группе
      # контейнера, и это единственный способ: менять пользователя нельзя,
      # ограничения тенанта root не пустят.
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: fill
        image: {{ .Values.emulatorImage }}
        command: ["sh", "-c"]
        args:
          - |
            set -e
            cp /opt/oberon/payload/prom.bin /opt/oberon/payload/oberon.dsk /payload/
            ls -la /payload/
        volumeMounts:
        - name: payload
          mountPath: /payload
      volumes:
      - name: payload
        persistentVolumeClaim:
          claimName: {{ include "oberon-vm.fullname" . }}-payload
