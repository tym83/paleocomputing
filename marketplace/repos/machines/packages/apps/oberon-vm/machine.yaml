# Passport of Wirth's machine. Everything that sets OberonVM apart from any other
# catalog machine is here; the templates are shared (library/retro-machine), and
# so is the hook.
#
# This is a chart file, not values: the tenant can rewrite values through the API
# (the schema root is open for engine keys), while the passport decides which
# emulator starts in virt-launcher and with which arguments. So only a catalog
# release changes the passport.
#
# Schema: library/retro-machine/machine.schema.json. The catalog checks compare
# the passport with the schema and with the application form (values.yaml,
# values.schema.json).
apiVersion: paleocomputing.io/v1alpha1
kind: Machine
name: oberon

# Where the ROM and the system image come from. The emulator is not in this
# image: it is in the virt-launcher image, next to libvirt, which probes it.
image: ghcr.io/tym83/paleocomputing/oberon-run:dev

domain:
  arch: risc5
  machine: oberon
  emulator: /usr/local/bin/qemu-system-risc5
  # Wirth's machine has one CPU, and there cannot be more.
  vcpus: 1
  # The screen is the built-in framebuffer; the VNC console shows it.
  graphics: vnc
  # The machine has no ACPI and will not hear a shutdown request: KubeVirt would
  # wait half a minute in vain on every restart.
  terminationGracePeriodSeconds: 0

payload:
  path: /payload
  files:
    # ROM: firmware, rewritten from the image on every update.
    - name: prom.bin
      from: /opt/oberon/payload/prom.bin
      role: firmware
      qemu: ["-bios", "{path}"]
    # System disk: the user's files live here. Placed once.
    - name: oberon.dsk
      from: /opt/oberon/payload/oberon.dsk
      role: disk
      # The Oberon file system takes new sectors past the end of the shipped
      # image (about 1 MB), and QEMU refuses writes beyond a raw image, so a
      # larger saved file or a compiler output trapped in Files (finding 77).
      size: 8388608
      qemu: ["-drive", "if=none,id=sd0,file={path},format=raw"]

# The hardware variant is a property of the machine, not an emulator mode. chk is
# a CPU with hardware array bounds checking: in RTL it is -DWITH_CHK, on the
# project page it is the hardware switch.
variants:
  base: {}
  chk:
    chk: "on"
defaultVariant: base

# The machine itself needs sixteen megabytes: its address bus sees no more, the
# rest is KubeVirt overhead. Less than 128Mi has not been tested.
memory:
  default: 128Mi
  min: 128Mi
  max: 1Gi

# The radio of Project Oberon (SCC.Mod, Net.Mod): an nRF24L01+ that the QEMU
# target switches on with -machine radio=<chardev>. An instance with `air` set
# names the relay, and the hook connects the radio to it over UDP.
air:
  machineProperty: radio
  port: 7524

# Commands the system runs at start (-machine commands=...): they arrive on
# RS232 receive and Boot.Mod, called at the end of System's body, runs them.
# The instance composes them from its form: a Kube role, or free text.
commands:
  machineProperty: commands
