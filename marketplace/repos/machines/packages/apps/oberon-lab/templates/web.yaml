{{- if .Values.web }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "oberon-lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: oberon-lab
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "oberon-lab.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: {{ .Values.images.web | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          # The unprivileged nginx image already listens on 8080 as user 101,
          # so neither the command nor the port needs overriding.
          readinessProbe:
            httpGet: { path: /lab.html, port: http }
          livenessProbe:
            httpGet: { path: /lab.html, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # ⚠ A volume over /etc/nginx/conf.d would wipe the configuration with
          # the wasm type that ships in the image. Only the directories nginx
          # actually writes to are mounted.
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "oberon-lab.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oberon-lab
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "oberon-lab.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
{{- end }}
{{- end }}
