{{- if .Values.runner }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-patch
  labels: {{- include "oberon-lab.labels" . | nindent 4 }}
data:
  # Paths cannot be ConfigMap keys: slashes are not allowed there. So the files
  # are numbered, and the key-to-path mapping goes into a separate manifest.
  # Encoding the path in the key itself (dots instead of slashes) does not work:
  # file names contain dots too, and nested directories would fall apart.
  manifest: |
    {{- range $i, $f := .Values.patch }}
    f{{ $i }} {{ $f.path }}
    {{- end }}
  {{- range $i, $f := .Values.patch }}
  f{{ $i }}: |
{{ $f.content | indent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Values.task }}
  labels: {{- include "oberon-lab.labels" . | nindent 4 }}
spec:
  backoffLimit: 0                 # retrying a lab verdict is pointless
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "oberon-lab.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: unpack
          image: {{ .Values.images.runner | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -s /cm/manifest ]; then
                while read key path; do
                  [ -n "$key" ] || continue
                  mkdir -p "/work/$(dirname "$path")"
                  cp "/cm/$key" "/work/$path"
                  echo "  prepared: $path"
                done < /cm/manifest
              else
                echo "  no changes; running on the original tree"
              fi
          volumeMounts:
            - { name: cm,   mountPath: /cm }
            - { name: work, mountPath: /work }
        - name: tree
          # Verilator and the compiler write to build/, so the project tree is
          # copied into a volume: the image root stays read-only.
          image: {{ .Values.images.runner | quote }}
          command: ["/bin/sh", "-c", "cp -a /lab/. /tree/"]
          volumeMounts:
            - { name: tree, mountPath: /tree }
      containers:
        - name: lab
          image: {{ .Values.images.runner | quote }}
          args: [{{ .Values.task | quote }}]
          workingDir: /lab
          volumeMounts:
            - { name: work, mountPath: /work, readOnly: true }
            - { name: tree, mountPath: /lab }
          resources:
            requests:
              cpu: {{ .Values.runnerResources.cpu | quote }}
              memory: {{ .Values.runnerResources.memory | quote }}
            limits:
              cpu: {{ .Values.runnerResources.cpu | quote }}
              memory: {{ .Values.runnerResources.memory | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cm
          configMap: { name: {{ .Release.Name }}-patch }
        - { name: work, emptyDir: {} }
        - { name: tree, emptyDir: {} }
{{- end }}
