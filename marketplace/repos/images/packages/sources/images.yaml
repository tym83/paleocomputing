# The "images" repository: boot images of machines for KubeVirt.
#
# This is the only catalog repository that needs cluster-level trust: it puts
# images into the shared cozy-public namespace, where every tenant sees them.
# The component is marked privileged, and the Cozystack validator emits a
# warning about it. That is intended: the operator must see it.
#
# About "new architectures for KubeVirt". The list of architectures in KubeVirt
# is closed: in the KubeVirt resource CRD the architectureConfiguration field has
# exactly four branches: amd64, arm64, ppc64le (deprecated) and s390x. A fifth
# entry cannot be added without changing KubeVirt itself. So an architecture that
# never existed in silicon arrives here not as a KubeVirt architecture but as a
# boot image with its emulator running inside: the machine in the cluster is
# ordinary; what is unusual is what it imitates.
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: paleocomputing.images
spec:
  sourceRef:
    kind: OCIRepository
    name: paleocomputing-images
    namespace: cozy-system
    path: /
  variants:
    - name: default
      components:
        - name: machine-images
          path: system/machine-images
          install:
            namespace: cozy-system
            releaseName: forgotten-machine-images
            privileged: true
