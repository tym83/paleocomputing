{{- /*
  The loop's permissions are in this namespace and by name: the KubeVirt
  resource, virt-controller and the status ConfigMap all live here. The only
  cluster-wide permission is reading nodes: the loop checks their architecture
  against the CPUs the launcher image is built for, and does not install it on a
  foreign node. Nodes cannot be restricted by name, and there is no write access to them.
*/ -}}
{{- $name := include "paleo-launcher.name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
rules:
# Our own entry in spec.customizeComponents.patches: read, and merge patch with
# a resourceVersion precondition.
- apiGroups: [kubevirt.io]
  resources: [kubevirts]
  resourceNames: [{{ .Values.kubevirtName }}]
  verbs: [get, list, watch, patch]
# Checking the version and argument layout of the live virt-controller.
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [virt-controller]
  verbs: [get]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [{{ include "paleo-launcher.status" . }}]
  verbs: [get, patch]
# Events on the KubeVirt resource on state change. create cannot be
# restricted by name: the server assigns the event name.
- apiGroups: [""]
  resources: [events]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-nodes
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-nodes
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-nodes
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
