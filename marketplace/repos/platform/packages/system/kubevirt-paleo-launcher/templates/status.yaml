{{- /*
  Reconcile status: state, reason, kubevirtVersion, launcherImage, updated.
  The loop writes the keys itself; Helm creates the ConfigMap empty, so it does
  not touch them on upgrade and removes them together with the release on delete.

    kubectl -n cozy-kubevirt get configmap kubevirt-paleo-launcher-status -o yaml
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paleo-launcher.status" . }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
