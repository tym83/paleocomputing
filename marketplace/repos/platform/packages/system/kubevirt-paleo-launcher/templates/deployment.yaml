{{- /*
  Reconcile loop: one Deployment, one replica, Recreate.

  Why not a CronJob. The patch must have a single writer, while CronJob runs can
  overlap (Forbid fixes that, but not for a job stuck in Terminating), the step
  is at least a minute, and every run is a new pod: scheduling, image pull, logs
  in a new place. And deletion: the hook would first have to suspend the
  schedule and wait for jobs already running. A Deployment is one long-lived
  process, reacts within INTERVAL seconds, keeps logs in one place and stops
  with a single scale.

  Why Recreate. RollingUpdate keeps the old and new pod running at the same
  time during an update: two writers. Recreate stops the old one first. Writes
  carry a resourceVersion precondition anyway, so even two writers would not
  silently overwrite each other, but there is no reason for them to fight.

  The API egress label: cozy-kubevirt has no Cilium network policies (the
  allow-to-apiserver policies are installed by the tenant chart, and only into
  tenant namespaces), so today it opens nothing. It is there in case policies
  come to system namespaces too: without it kubectl would hang silently instead
  of getting a refusal (finding 58).
*/ -}}
{{- $name := include "paleo-launcher.name" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels: {{- include "paleo-launcher.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paleo-launcher.labels" . | nindent 8 }}
        policy.cozystack.io/allow-to-apiserver: "true"
      annotations:
        # A new table or script means a new pod: a ConfigMap in a volume is
        # updated with a delay, and the table must change together with the release.
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext: {{- include "paleo-launcher.podSecurity" . | nindent 8 }}
      containers:
      - name: reconcile
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/opt/paleo/reconcile.sh", "loop"]
        env:
        - name: KUBEVIRT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBEVIRT_NAME
          value: {{ .Values.kubevirtName | quote }}
        - name: LAUNCHER_TABLE
          value: /opt/paleo/launchers.txt
        - name: STATUS_CONFIGMAP
          value: {{ include "paleo-launcher.status" . }}
        - name: INTERVAL
          value: {{ .Values.interval | quote }}
        - name: ALLOW_WORKLOAD_UPDATE
          value: {{ .Values.allowWorkloadUpdate | quote }}
        - name: HOME
          value: /tmp
        securityContext: {{- include "paleo-launcher.containerSecurity" . | nindent 10 }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: scripts
          mountPath: /opt/paleo
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: {{ $name }}
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
