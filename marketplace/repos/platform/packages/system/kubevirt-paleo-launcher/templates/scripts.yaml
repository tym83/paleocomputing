{{- /*
  The reconcile script and the launcher table. The table is a copy built by
  tools/gen-launcher-table.py from kubevirt/versions.txt (Helm does not read
  files outside the chart), with the release tag substituted at publish time.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paleo-launcher.name" . }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
data:
  reconcile.sh: |-
{{ .Files.Get "files/reconcile.sh" | indent 4 }}
  launchers.txt: |-
{{ .Files.Get "files/launchers.txt" | indent 4 }}
