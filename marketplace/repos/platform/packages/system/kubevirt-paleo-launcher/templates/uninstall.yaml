{{- /*
  Deletion: remove our own patch from the KubeVirt resource, leave others alone.

  A pre-delete hook, not post-delete: the job needs the script from the
  release's ConfigMap, and after the release is deleted it is gone. But during
  pre-delete the loop is still alive and would restore the patch between the
  hook and the Deployment deletion. So the job first stops the loop (scale to
  zero and wait for the pod to go away), then removes the patch.

  Permissions are its own, also pre-delete hooks with a lower weight. Everything
  is deleted on hook-succeeded; a failed job stays for inspection, and a repeated
  delete removes it via before-hook-creation. activeDeadlineSeconds keeps a job
  that got no image or permissions from blocking the release deletion forever.
  If it fails, the release deletion stops with an error and the patch stays
  visible; it must not be left silently: after the next KubeVirt update it would
  break every machine in the cluster.
*/ -}}
{{- $name := include "paleo-launcher.name" . }}
{{- $hook := printf "%s-uninstall" $name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hook }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hook }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [kubevirt.io]
  resources: [kubevirts]
  resourceNames: [{{ .Values.kubevirtName }}]
  verbs: [get, patch]
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [virt-controller, {{ $name }}]
  verbs: [get]
# Stopping the loop: only our own Deployment.
- apiGroups: [apps]
  resources: [deployments/scale]
  resourceNames: [{{ $name }}]
  verbs: [get, patch, update]
# Wait for the loop pod to go away. list cannot be restricted by name.
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hook }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hook }}
subjects:
- kind: ServiceAccount
  name: {{ $hook }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hook }}
  labels: {{- include "paleo-launcher.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-paleo-launcher-uninstall
        app.kubernetes.io/instance: {{ .Release.Name }}
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: {{ $hook }}
      restartPolicy: Never
      enableServiceLinks: false
      securityContext: {{- include "paleo-launcher.podSecurity" . | nindent 8 }}
      containers:
      - name: uninstall
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/opt/paleo/reconcile.sh", "uninstall"]
        env:
        - name: KUBEVIRT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBEVIRT_NAME
          value: {{ .Values.kubevirtName | quote }}
        - name: LAUNCHER_TABLE
          value: /opt/paleo/launchers.txt
        - name: SELF_DEPLOYMENT
          value: {{ $name }}
        - name: SELF_SELECTOR
          value: "app.kubernetes.io/name=kubevirt-paleo-launcher,app.kubernetes.io/instance={{ .Release.Name }}"
        - name: STOP_TIMEOUT
          value: "60"
        - name: HOME
          value: /tmp
        securityContext: {{- include "paleo-launcher.containerSecurity" . | nindent 10 }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: scripts
          mountPath: /opt/paleo
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: {{ $name }}
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
