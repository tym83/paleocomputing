# The "platform" repository: what the cluster needs so that the catalog's
# foreign machines can run in it at all.
#
# Today there is one component here: kubevirt-paleo-launcher keeps the
# cluster's virt-launcher image paired with the KubeVirt version. The image
# carries libvirt and the emulators of all foreign catalog architectures
# (kubevirt/targets.txt), so there is one component for the whole machine
# family, not one component per machine.
#
# Cluster-level trust: the component changes the KubeVirt resource, that is,
# the image on which EVERY virtual machine of the cluster starts. So it is marked
# privileged: it is installed only with the operator's explicit consent
# (`cozypkg add --allow-privileged`), and the Cozystack validator warns about it.
# The cozy-kubevirt namespace is privileged anyway (the platform's own kubevirt
# component owns it): the flag extends nothing.
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: paleocomputing.platform
spec:
  sourceRef:
    kind: OCIRepository
    name: paleocomputing-platform
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        # The KubeVirt resource and virt-controller come from here.
        - cozystack.kubevirt
      components:
        - name: kubevirt-paleo-launcher
          path: system/kubevirt-paleo-launcher
          install:
            # Same place as the KubeVirt resource: all permissions are a Role
            # in this namespace, no ClusterRole.
            namespace: cozy-kubevirt
            releaseName: kubevirt-paleo-launcher
            privileged: true
