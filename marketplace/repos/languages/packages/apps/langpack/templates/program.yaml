{{- if .Values.program }}
{{- if eq .Values.srcdir .Values.workdir }}
{{- fail "langpack: srcdir and workdir are the same; sources are read-only and would cover the working directory" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-program
  labels: {{- include "langpack.labels" . | nindent 4 }}
# The program text is encoded with toJson: it is multi-line and arbitrary,
# and a YAML literal block would break it apart on indentation.
data:
  {{- range $f := .Values.program }}
  {{ $f.path }}: {{ $f.content | toJson }}
  {{- end }}
{{- end }}
