##
## @section The language and its environment
##

## @param {string} language=Oberon - What the language is called. Used in titles and labels.
language: Oberon

## @param {string} image - Image that contains the language implementation.
## The default is the Oberon environment: Wirth's compiler run as an ordinary
## program, with no windows, mouse or screen. Feed it a source, get an answer.
image: ghcr.io/tym83/paleocomputing/oberon-run:dev

## @param {string} mode=job - How the environment runs.
## `service`: a permanently running environment reachable over HTTP (REPL, notebook, IDE).
## `job`: a one-off run; the environment lives only while it computes.
## The cluster has no scale-to-zero, so "spend nothing while idle" means
## exactly `job`.
## @x-cozystack-options {enum: [service, job]}
mode: job

##
## @section What to run
##

## @param {[]string} command - Entry point. Empty means the image command.
command: []

## @param {[]string} args - Its arguments.
args: []

## @typedef {struct} SourceFile - One source file.
## @field {string} path - File name inside the working directory.
## @field {string} content - File text.

## @param {[]SourceFile} program - Sources. Placed into srcdir read-only.
## Names are flat: there are no directories inside.
program: []

## @param {string} srcdir=/src - Where the sources are mounted. Read-only:
## it is a ConfigMap. Copying them elsewhere is the image's own business.
srcdir: /src

## @param {string} workdir=/work - Working directory. An empty writable volume:
## the language puts whatever it produces here.
workdir: /work

##
## @section Resources and access
##

## @param {int} replicas=1 - Replicas in service mode.
replicas: 1

## @param {int} port=8080 - Port the environment listens on in service mode.
port: 8080

## @param {string} [host] - External host name for service mode.
host: ""

## @param {string} [ingressClassName] - Ingress class.
ingressClassName: ""

## @typedef {struct} Resources - Resource request.
## @field {string} cpu
## @field {string} memory

## @param {Resources} resources - How much to give the environment.
resources:
  cpu: "500m"
  memory: "512Mi"

## @param {int} backoffLimit=1 - How many times to retry a failed one-off run.
backoffLimit: 1
