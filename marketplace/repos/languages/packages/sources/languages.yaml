# The "languages" repository: environments for languages that never had an
# implementation, and for those whose implementation has long been unavailable.
#
# A note on "serverless": Cozystack has no FaaS substrate (no Knative or an
# equivalent), so there is nothing to provide scale-to-zero on request here.
# The practical property "nothing spins idle" comes from the one-off job mode
# (mode: job): the environment comes up for the duration of a run and disappears.
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: paleocomputing.languages
spec:
  sourceRef:
    kind: OCIRepository
    name: paleocomputing-languages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        - cozystack.cozystack-engine
      components:
        - name: langpack
          path: apps/langpack
        - name: languages-rd
          path: system/languages-rd
          install:
            namespace: cozy-system
            releaseName: forgotten-languages-rd
