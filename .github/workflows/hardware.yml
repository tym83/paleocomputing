# Heavy checks: the real RTL and the QEMU target.
#
# Why separately and not on every push: verilator and QEMU are built here, and
# the runs take tens of minutes. The fast checks live in check.yml and stay
# fast; otherwise people start waiting for them, and then bypassing them.
#
# ⚠ Before this, RTL and QEMU were not checked automatically AT ALL: that was written
# only as a comment in another workflow. A comment does not replace checks.
name: hardware

on:
  workflow_dispatch:
    inputs:
      kube_load:
        description: 'Also run the Kube load test (several QEMU machines per node count)'
        type: boolean
        default: false
  schedule:
    # Once a week, on the night from Sunday to Monday UTC.
    - cron: '17 3 * * 1'
  pull_request:
    # On changes to the hardware itself and its tooling, always.
    paths:
      - 'impl/rtl/**'
      - 'impl/tb/**'
      - 'impl/tools/asm.py'
      - 'impl/lm/**'
      - 'impl/ext/norebo/Runtime/**'
      - 'qemu/**'
      - '.github/workflows/hardware.yml'

jobs:
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator >/dev/null
          verilator --version

      # Directed ISA tests on both cores plus an equivalence check of the
      # decoder: taking over someone else's encoding in RISC5 would show up as a silent
      # change in the behaviour of old code.
      - name: Instruction set tests
        run: make test
        working-directory: impl

      # The system boots on the real RTL, and the screen checksum must
      # match the reference: on the base core, on the core with CHK and on the core with
      # descriptors (release 14).
      - name: System boot
        run: make boot boot-chk boot-desc
        working-directory: impl

      # The "descriptors" rung: the central issue's loop on four rungs and a
      # negative control (a descriptor shorter than the array must stop
      # the loop). Seconds.
      - name: Loop with a descriptor
        run: make desc-loop
        working-directory: impl

      # Differential bench: RTL against the reference emulator, instruction by
      # instruction, while booting the real system.
      - name: Differential bench
        run: make lockstep lockstep-desc
        working-directory: impl

      # Release #2: the fast FP multiplier is bit-for-bit equal to the original (a million
      # random pairs on top of an exhaustive sweep of exponents), the system boots on it with the
      # same screen, the model on RTL prints the reference text.
      - name: Fast FP multiplier
        run: make fpmul-diff FPMUL_N=1000000 boot-fast
        working-directory: impl

      - name: Language model on RTL
        run: make lm
        working-directory: impl

  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The decoder is accepted by QEMU's own generator: it complains if even
      # one instruction bit is not covered, and the decoder has already been caught on exactly that.
      - name: Decoder
        run: make check
        working-directory: qemu

      - name: Target build
        run: make build
        working-directory: qemu

      # The main check of the target: not "it builds" but "it computes the same as the hardware".
      - name: Comparison with the model taken from RTL
        run: make diff
        working-directory: qemu

      # Floating point against the risc-fp.c reference: 1056 cases and a negative
      # control. Before, the comparison was done once by hand (finding 50).
      - name: Floating point comparison
        run: make fp
        working-directory: qemu

      # Hardware bounds checking: the same program that computes the numbers on
      # the page, in QEMU and on the model from RTL. Plus a negative control.
      # Verilator is not needed here: the model taken from RTL is in the repository
      # prebuilt (risc5-chk.wasm); the page serves the same one to the reader.
      - name: ISA extension comparison
        run: python3 qemu/test/compare_chk.py

      # Release #2: the system in QEMU compiles the model module itself and prints
      # text; it is read off the disk and compared with the reference. It also checks
      # writing to disk in QEMU (finding 77).
      # Keyboard end to end: a command typed into System.Tool and run by a
      # middle click. Byte loads from the key port used to be rejected and
      # the first key press hung the system (finding 86).
      - name: Keyboard
        run: python3 qemu/test/keyboard_check.py

      # Integer arithmetic of the running system against Python's: a product
      # followed by MOD used to return the product's high part (finding 87).
      - name: Arithmetic in the system
        run: |
          make -C impl tools
          python3 qemu/test/arith_check.py

      - name: Language model in the system
        run: |
          make -C impl tools
          python3 impl/lm/qemu_run.py

      # Wirth's radio network: two machines and the relay on one Docker network;
      # Net.SendMsg from one must reach the other's log, and nothing may arrive
      # once the relay is stopped.
      - name: Radio
        run: python3 qemu/test/radio_check.py
      # Kube with real nodes: a control plane and two kubelets on three machines
      # talking over the radio; a node switched off goes NotReady and its pods move.
      - name: Kube over the radio
        run: python3 qemu/test/kube_radio_check.py
      # Disaster recovery for that cluster: a node lost and back, the control
      # plane lost and restored from its disk, the air lost, a lossy air.
      - name: Kube DR
        run: python3 qemu/test/kube_dr_check.py
      # A cluster that forms from the machines' commands at start, as the
      # catalog sets them; no key pressed. The plane restarts by itself too.
      - name: Kube boot
        run: python3 qemu/test/kube_boot_check.py
      # Indexing through a descriptor (release 14): QEMU with chk=on,desc=on against
      # the native RTL model with -DWITH_DESC; there is no WASM build of this core, so
      # Verilator is needed here. The central issue's loop and random IDX with
      # a trap; the negative control is chk=on without desc=on.
      - name: Descriptor comparison
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator >/dev/null
          make -C impl build/obj_desc/run_tests_desc
          python3 qemu/test/compare_idx.py

  # Load on Kube over the radio: one air, a control plane and N nodes, each a
  # QEMU machine. On request only; every machine keeps a core busy (Oberon's
  # loop does not idle), so the larger counts also measure a crowded host.
  kube-load:
    if: github.event_name == 'workflow_dispatch' && inputs.kube_load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nodes: [2, 4, 6, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Target build
        run: make build
        working-directory: qemu
      - name: Tools
        run: make -C impl tools
      - name: Load, ${{ matrix.nodes }} nodes
        run: |
          set -o pipefail
          python3 qemu/test/kube_load_check.py --nodes ${{ matrix.nodes }} --json | tee load.txt
          echo "### Kube load, ${{ matrix.nodes }} nodes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -1 load.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: The air of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kube-load-${{ matrix.nodes }}-air
          path: impl/build/kube-*/air.jsonl
