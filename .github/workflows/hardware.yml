# Тяжёлые проверки: настоящий RTL и цель QEMU.
#
# Почему отдельно и не на каждый пуш: здесь собираются verilator и QEMU, и
# прогоны идут десятками минут. Быстрые проверки живут в check.yml и остаются
# быстрыми — иначе их начинают ждать, а потом и обходить.
#
# ⚠ До этого RTL и QEMU не проверялись автоматически ВООБЩЕ: это было записано
# только комментарием в другом workflow. Комментарий проверок не заменяет.
name: hardware

on:
  workflow_dispatch:
  schedule:
    # Раз в неделю, ночью с воскресенья на понедельник по UTC.
    - cron: '17 3 * * 1'
  pull_request:
    # На правки самого железа и оснастки — обязательно.
    paths:
      - 'impl/rtl/**'
      - 'impl/tb/**'
      - 'impl/tools/asm.py'
      - 'impl/lm/**'
      - 'impl/ext/norebo/Runtime/**'
      - 'qemu/**'
      - '.github/workflows/hardware.yml'

jobs:
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator >/dev/null
          verilator --version

      # Направленные тесты ISA на обоих ядрах плюс проверка эквивалентности
      # декодера: занятие чужой кодировки в RISC5 проявилось бы молчаливым
      # изменением поведения старого кода.
      - name: Тесты системы команд
        run: make test
        working-directory: impl

      # Система грузится на настоящем RTL, и контрольная сумма экрана обязана
      # совпасть с эталонной — на базовом ядре, на ядре с CHK и на ядре с
      # дескрипторами (выпуск 14).
      - name: Загрузка системы
        run: make boot boot-chk boot-desc
        working-directory: impl

      # Ступень «дескрипторы»: цикл центрального номера на четырёх ступенях и
      # отрицательный контроль (дескриптор короче массива обязан остановить
      # цикл). Секунды.
      - name: Цикл с дескриптором
        run: make desc-loop
        working-directory: impl

      # Дифференциальный стенд: RTL против эталонного эмулятора, инструкция за
      # инструкцией, на загрузке настоящей системы.
      - name: Дифференциальный стенд
        run: make lockstep lockstep-desc
        working-directory: impl

      # Выпуск №2: быстрый FP-умножитель побитово равен исходному (миллион
      # случайных пар сверх перебора порядков), система на нём грузится с тем
      # же экраном, модель на RTL печатает эталонный текст.
      - name: Быстрый FP-умножитель
        run: make fpmul-diff FPMUL_N=1000000 boot-fast
        working-directory: impl

      - name: Языковая модель на RTL
        run: make lm
        working-directory: impl

  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Декодер принимается генератором самого QEMU: он ругается, если хоть
      # один бит команды не расписан, и ровно на этом декодер уже ловился.
      - name: Декодер
        run: make check
        working-directory: qemu

      - name: Сборка цели
        run: make build
        working-directory: qemu

      # Главная проверка цели: не «собралось», а «считает то же, что железо».
      - name: Сверка с моделью, снятой с RTL
        run: make diff
        working-directory: qemu

      # Плавающая точка против эталона risc-fp.c: 1056 случаев и отрицательный
      # контроль. Раньше сверка была сделана один раз руками (находка 50).
      - name: Сверка плавающей точки
        run: make fp
        working-directory: qemu

      # Аппаратная проверка границ: та же программа, что считает числа на
      # странице, в QEMU и на модели с RTL. Плюс отрицательный контроль.
      # Verilator здесь не нужен: модель, снятая с RTL, лежит в репозитории
      # собранной (risc5-chk.wasm) — её же отдаёт страница читателю.
      - name: Сверка расширения ISA
        run: python3 qemu/test/compare_chk.py

      # Выпуск №2: система в QEMU сама компилирует модуль модели и печатает
      # текст; он снимается с диска и сверяется с эталоном. Заодно проверяет
      # запись на диск в QEMU (находка 77).
      - name: Языковая модель в системе
        run: |
          make -C impl tools
          python3 impl/lm/qemu_run.py
      # Индексация через дескриптор (выпуск 14): QEMU с chk=on,desc=on против
      # нативной модели RTL с -DWITH_DESC — WASM-сборки этого ядра нет, поэтому
      # здесь нужен Verilator. Цикл центрального номера и случайные IDX с
      # ловушкой; отрицательный контроль — chk=on без desc=on.
      - name: Сверка дескрипторов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator >/dev/null
          make -C impl build/obj_desc/run_tests_desc
          python3 qemu/test/compare_idx.py
