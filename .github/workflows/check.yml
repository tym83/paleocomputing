# Checks of the browser layer on every change.
#
# Before this, NOTHING ran automatically in the repository except deploying
# the site and building images on a tag. That cost two silent breakages at once:
# `make labs` failed on its very first line ever since the language switch appeared
# (node has no `location`), and for a month the site served last year's lab.
# Both show up in a minute and a half, but only if someone is looking.
#
# There is no RTL and no QEMU here: they need verilator, emsdk and hours. The machine run
# takes the built risc5.js and risc5.wasm straight from the repository; they are there
# because Pages serves static files as is.
#
# The checks are split by cost. The fast ones (seconds) run on every push.
# The labs run the real machine (nine Oberon boots, about
# a quarter of an hour), so they run only on pull requests: main receives
# exactly what has already passed them in the pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Seconds.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hook lives in two places: kubevirt/ and the catalog package (Helm does not
      # read files outside the chart). The copy from the package goes to the cluster, and once
      # it fell behind: the catalog asked for chk, the machine started as base.
      - name: Hook
        run: |
          cmp kubevirt/onDefineDomain.py \
              marketplace/repos/machines/packages/apps/oberon-vm/files/onDefineDomain.py \
            || { echo "❌ the hook copy in the package diverged from kubevirt/"; exit 1; }
          python3 kubevirt/hook_test.py \
            marketplace/repos/machines/packages/apps/oberon-vm/files/onDefineDomain.py
      # Architectures in libvirt are data from kubevirt/targets.txt. The check runs on a
      # toy tree: for RISC5 the edits are the same as before, a second architecture
      # takes one line of the list.
      - name: libvirt patch
        run: python3 qemu/libvirt/patch_test.py

      # Release #2: the weights match the manifest, the model module on the Norebo
      # emulator prints byte for byte the same text as the reference in RISC5
      # arithmetic. Seconds: a C emulator, three seeds of 64 characters.
      - name: Language model (emulator vs reference)
        run: make lm-check
        working-directory: impl

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The only external dependency of the book build.
      - name: markdown
        run: pip install --quiet 'markdown==3.10.2'

      # The book: links between chapters and links to the labs are checked.
      - name: Book
        run: python3 tools/mkbook.py
        working-directory: impl

      # Page markup: what the script looks for is actually there. Breakages of this
      # kind are not shown by the browser as errors; the page simply stops
      # responding.
      - name: Page markup
        run: node page-test.mjs
        working-directory: impl/web

      # The site: contents and all local links. This is exactly the check that was missing
      # when /oberon/book/en/ served a live 404.
      - name: Site build
        run: ./tools/build-site.sh _site

      # The page in a real browser. The static checks twice let a dead lab
      # through: the browser silently does not run an unclosed <script>, and that is
      # visible only where the page is executed. Chrome is already on the runner.
      - name: Site in a browser
        run: ./tools/browser-smoke.sh _site

      # The book is built from docs/book/*.md. If the build changed anything,
      # the repository holds something other than what gets built: the same disease as
      # the site copy, only inside one directory.
      - name: Built output matches the repository
        run: git diff --exit-code -- impl/web/book

  # A quarter of an hour: nine labs, each on its own Oberon boot.
  # A lab whose check is always green or always red is
  # useless, so the run requires a transition from "not done" to "done".
  labs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Labs
        run: node labs-test.mjs
        working-directory: impl/web

      # The protocol between the page and the worker thread. They can diverge silently:
      # the picture simply stops updating, and no other check
      # would see it.
      - name: Worker thread protocol
        run: node worker-test.mjs
        working-directory: impl/web

      # The numbers of the central issue: the reader sees them on the page, and they are
      # computed by the same module as here.
      - name: Bounds-check cost
        run: node bench-test.mjs
        working-directory: impl/web
