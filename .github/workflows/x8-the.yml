# The Electrologica X8 and THE (impl/x8-the).
#
# x8: the emulator is built, and the X8 test program of the Mathematisch
#   Centrum (1971, fetched from Dick Grune's page) runs its 375 tests on it;
#   the expectations written in its comments must hold.
# the: THE boots by IP, runs its three user programs with the operator's
#   keys, and its console and line printer must be as expected; the labs that
#   need no change run, and the layering break must hang the machine.
# web: the browser build is made again with the pinned emscripten image and
#   must match what is committed in impl/x8-the/web (the site serves it).
name: x8-the

on:
  push:
    branches: [main]
    paths: ['impl/x8-the/**', '.github/workflows/x8-the.yml']
  pull_request:
    paths: ['impl/x8-the/**', '.github/workflows/x8-the.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: impl/x8-the

jobs:
  x8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emulator
        run: make -C emu
      - name: The X8 test program of 1971
        run: tests/x8stest.sh

  the:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emulator
        run: make -C emu
      - name: THE, console and line printer
        run: tests/the.sh
      - name: Labs
        run: |
          labs/check.sh 01 > /dev/null
          sed -i 's/^    ncp = 8, /    ncp = 5, /' the/the.elan && labs/check.sh 02 | tail -1 && git checkout the/
          sed -i 's/^    layerbreak = 0, /    layerbreak = 1, /' the/the.elan && MAX=60 labs/check.sh 03 | tail -1 && git checkout the/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The X8 in WebAssembly, the THE tape, the addresses for the page
        run: |
          mkdir -p build
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src/emu docker.io/emscripten/emsdk:3.1.74 make web
          web/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x8-web
          path: impl/x8-the/web
      - name: Built output matches the repository
        run: |
          git status --porcelain -- web
          test -z "$(git status --porcelain -- web)"
