# Build the virt-launcher image on every change that touches it.
#
# ⚠ Before this, kubevirt/Containerfile was built only in publish.yml, that is,
# at release time. A broken change (once it was a missing `mkdir -p
# /src/qemu`) passed review, got merged and surfaced only at release, when
# it had to be fixed in a hurry.
#
# Why a separate workflow and not a job in hardware.yml: the path filter there is shared
# by the whole file. Add kubevirt/** there, and a hook change would drag
# RTL and QEMU along for an hour and a half to two hours. Here it is only the image.
#
# Nothing is published: the image is built, loaded into the runner's docker and
# checked by the same script as at release. The cache is the same as in
# publish.yml (scope=launcher-<KubeVirt version>): pushes to main fill it,
# PRs use it.
#
# Built for every KubeVirt version from kubevirt/versions.txt, as at
# release (finding 60): otherwise a broken version pair would surface only there.
#
# And for every node architecture from kubevirt/platforms.txt, on a native
# runner: an image built only for amd64 will not start a single VM on an
# arm64 node.
name: launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kubevirt/**'
      - 'qemu/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'kubevirt/**'
      - 'qemu/**'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          versions=$(awk '!/^#/ && NF { print $1 }' kubevirt/versions.txt | jq -Rnc '[inputs]')
          platforms=$(awk '!/^#/ && NF { print $1, $2 }' kubevirt/platforms.txt \
            | jq -Rnc '[inputs | split(" ") | {arch: .[0], runner: .[1]}]')
          [ "$versions" != "[]" ] || { echo "kubevirt/versions.txt lists no versions"; exit 1; }
          [ "$platforms" != "[]" ] || { echo "kubevirt/platforms.txt lists no architectures"; exit 1; }
          # KubeVirt version × node architecture: one build per pair, on a
          # native CPU (kubevirt/platforms.txt).
          list=$(jq -nc --argjson v "$versions" --argjson p "$platforms" '[$v[] as $k | $p[] | . + {kubevirt: $k}]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: build (${{ matrix.kubevirt }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # With a cold cache, libvirt and QEMU take up to an hour and a half to build.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      # install: true so that `docker build` inside build.sh goes through buildx
      # and can use the GitHub Actions cache.
      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ⚠ Without this the type=gha cache silently does not work: the `run` step is not
      # given the cache token, and buildx drops --cache-from/--cache-to without a warning.
      - uses: crazy-max/ghaction-github-runtime@v4

      # The name is the same as at release (the family, not one machine), only with
      # `pr` instead of the release version.
      - id: meta
        run: echo "image=virt-launcher:${{ matrix.kubevirt }}-paleo-pr-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # --load, not --push: the image is needed only here, for the check.
      # Provenance attestation cannot be loaded into local docker, so it is disabled.
      - name: Build
        run: |
          kubevirt/build.sh --kubevirt "${{ matrix.kubevirt }}" "${{ steps.meta.outputs.image }}" \
            --load --provenance=false \
            --platform linux/${{ matrix.arch }} \
            --cache-from type=gha,scope=launcher-${{ matrix.kubevirt }}-${{ matrix.arch }} \
            --cache-to type=gha,scope=launcher-${{ matrix.kubevirt }}-${{ matrix.arch }},mode=max

      - name: Check the machines in the image
        run: kubevirt/check_image.sh "${{ steps.meta.outputs.image }}"
