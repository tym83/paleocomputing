# A mirror of the build base of the KubeVirt launcher image.
#
# quay.io/centos/centos:stream9 is rewritten every day, and quay removes the
# old digests within days: a Containerfile pinned to one could no longer be
# built (it happened twice). The base is copied here under a dated tag, in this
# repository's own registry, where a digest stays; kubevirt/Containerfile is
# pinned to the copy. Run it when the base should move, then pin the digest it
# prints.
name: mirror-base

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror-base.yml

permissions:
  contents: read
  packages: write

jobs:
  centos:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy quay.io/centos/centos:stream9
        run: |
          tag="ghcr.io/${{ github.repository_owner }}/paleocomputing/centos:stream9-$(date -u +%Y%m%d)"
          docker buildx imagetools create --tag "$tag" quay.io/centos/centos:stream9
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "### Base mirrored" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tag@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "mirrored: $tag@$digest"
