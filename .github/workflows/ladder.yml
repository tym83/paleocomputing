# The bounds-check cost ladder on real x86-64 and arm64.
#
# Locally the ladder is measured on an Apple M4 and in a linux/arm64 container; x86-64
# is available there only through QEMU emulation, where timing means nothing. Here we
# get live GitHub machines. What is measured and how: impl/docs/FINDING-61-bounds-ladder.md;
# the "why" experiment (why.py) is there too, in the section "Why: the experiment".
#
# ⚠ The machines are shared and virtual: neighbours, frequency and CPU model change
# from run to run. What matters is ratios to `none` within one run, not
# nanoseconds. The CPU model is written into the results header.
name: ladder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'impl/bench/ladder/**'
      - 'impl/tools/gen_bounds_bench.py'
      - '.github/workflows/ladder.yml'

permissions:
  contents: read

jobs:
  ladder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: ci-linux-x86_64
          - runner: ubuntu-24.04-arm
            label: ci-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # clang and gcc are in the images. rustc was not always in the arm64 images,
      # so we install a minimal stable if it is missing.
      - name: Tools
        run: |
          if ! command -v rustc >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Ladder
        run: |
          python3 impl/bench/ladder/ladder.py --label '${{ matrix.label }}' \
            --note 'machine: GitHub Actions `${{ matrix.runner }}`, shared virtual'
          cat 'impl/bench/ladder/results/${{ matrix.label }}.md' >> "$GITHUB_STEP_SUMMARY"

      # Why the check is sometimes free and sometimes not: the index chain grows by k
      # links, there are c checks, cycles are calibrated with dependent additions.
      # C only (clang, gcc); about a minute per machine.
      - name: Why
        run: |
          python3 impl/bench/ladder/why.py --label '${{ matrix.label }}' \
            --note 'machine: GitHub Actions `${{ matrix.runner }}`, shared virtual'
          cat 'impl/bench/ladder/results/why-${{ matrix.label }}.md' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ladder-${{ matrix.label }}
          path: |
            impl/bench/ladder/results/${{ matrix.label }}.md
            impl/bench/ladder/results/why-${{ matrix.label }}.md
            impl/build/ladder/${{ matrix.label }}/
            impl/build/ladder/why-${{ matrix.label }}/
