# Publishing the series site to GitHub Pages.
#
# The classic Pages source can serve only the repository root or
# /docs, while the site is built into /_site, so deployment goes through Actions.
#
# The build is tools/build-site.sh, the same command as locally (`make site` in
# impl/). One command for both places: the deployment cannot diverge from what
# you see locally.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'impl/web/**', 'tools/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallel deployments do not cancel each other: one already running must finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The same script checks the contents and the local links: a deployment with a broken
      # link does not go out.
      - name: Build the site
        run: ./tools/build-site.sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
