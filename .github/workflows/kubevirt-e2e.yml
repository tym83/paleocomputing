# End-to-end check of the launcher on real KubeVirt, for every version from
# kubevirt/versions.txt (finding 67).
#
# launcher.yml proves that the image builds and carries the machines. That is not enough:
# the launcher talks to virt-handler over a versioned protocol, and
# whether it works with a given KubeVirt version is visible only in a cluster. For 1.9.0
# only booting Oberon inside the image (test-in-image.sh) had been checked so far.
#
# Here the runner hosts a kind cluster with KubeVirt of the same version in emulation
# (there is no KVM on the runner), the launcher is swapped by a pass of the
# kubevirt-paleo-launcher platform component (its reconcile.sh), the oberon-vm chart is
# installed from the catalog, and the machine's screen is captured through `virtctl vnc`, the path
# a user takes. The check is a match with the reference: dark_pixels=18607.
#
# The steps are kubevirt/e2e.sh: the same scenario is also run by hand.
#
# And on every node architecture from kubevirt/platforms.txt, on a native runner:
# on arm64 KubeVirt behaves differently (the virt machine type and UEFI by default), and
# a built image does not yet mean a working machine (finding 71).
name: kubevirt-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kubevirt/**'
      - 'qemu/**'
      - 'marketplace/repos/machines/packages/library/**'
      - 'marketplace/repos/platform/packages/system/kubevirt-paleo-launcher/**'
      - '.github/workflows/kubevirt-e2e.yml'
  pull_request:
    paths:
      - 'kubevirt/**'
      - 'qemu/**'
      - 'marketplace/repos/machines/packages/library/**'
      - 'marketplace/repos/platform/packages/system/kubevirt-paleo-launcher/**'
      - '.github/workflows/kubevirt-e2e.yml'

permissions:
  contents: read

concurrency:
  group: kubevirt-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          versions=$(awk '!/^#/ && NF { print $1 }' kubevirt/versions.txt | jq -Rnc '[inputs]')
          platforms=$(awk '!/^#/ && NF { print $1, $2 }' kubevirt/platforms.txt \
            | jq -Rnc '[inputs | split(" ") | {arch: .[0], runner: .[1]}]')
          [ "$versions" != "[]" ] || { echo "kubevirt/versions.txt lists no versions"; exit 1; }
          [ "$platforms" != "[]" ] || { echo "kubevirt/platforms.txt lists no architectures"; exit 1; }
          list=$(jq -nc --argjson v "$versions" --argjson p "$platforms" '[$v[] as $k | $p[] | . + {kubevirt: $k}]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  e2e:
    needs: versions
    name: e2e (${{ matrix.kubevirt }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A build with a cold cache takes up to an hour and a half (as in launcher.yml), the
    # check itself takes minutes.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.list) }}
    env:
      KUBEVIRT_VERSION: ${{ matrix.kubevirt }}
      # paleo.local is not a registry: the image is local only, `kind load` brings it
      # into the cluster, and there is nowhere to pull it from.
      LAUNCHER_IMAGE: paleo.local/virt-launcher:${{ matrix.kubevirt }}-paleo-e2e-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      # The launcher image, its build cache, the KubeVirt images and their copies on the kind node
      # do not fit into the runner's free space with a margin.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The buildx builder (docker-container) is there for the GitHub Actions cache; `docker
      # build` inside build.sh goes through it via BUILDX_BUILDER.
      - id: buildx
        uses: docker/setup-buildx-action@v3

      # ⚠ Without this the type=gha cache silently does not work (see launcher.yml).
      - uses: crazy-max/ghaction-github-runtime@v4

      # The cache is the same as for launcher.yml and publish.yml (scope=launcher-<version>-<arch>),
      # read only: they fill it, and a second writer to the same scope
      # would only make the job longer.
      - name: Build the launcher
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          kubevirt/build.sh --kubevirt "$KUBEVIRT_VERSION" "$LAUNCHER_IMAGE" \
            --load --provenance=false --platform linux/${{ matrix.arch }} \
            --cache-from type=gha,scope=launcher-${{ matrix.kubevirt }}-${{ matrix.arch }}

      - name: kind and virtctl
        run: kubevirt/e2e.sh tools

      - name: kind cluster
        run: kubevirt/e2e.sh cluster

      - name: KubeVirt ${{ matrix.kubevirt }}
        run: kubevirt/e2e.sh kubevirt

      - name: Swap the launcher via the platform component pass
        run: kubevirt/e2e.sh launcher

      - name: oberon-vm machine from the catalog
        run: kubevirt/e2e.sh machine

      - name: Screen through virtctl vnc
        run: kubevirt/e2e.sh screen

      - name: Failure diagnostics
        if: failure()
        run: kubevirt/e2e.sh diag

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ matrix.kubevirt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/paleo-e2e-${{ matrix.kubevirt }}/screen.ppm
          if-no-files-found: ignore
