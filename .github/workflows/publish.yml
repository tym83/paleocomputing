# Publishing the lab images.
#
# Images are built and signed here, not on someone's laptop, for two reasons.
# First, the cosign signature is KEYLESS: the build gets a one-time
# identity from GitHub and signs with it, and the entry in the public transparency
# log records that the artifact was built by exactly this workflow in this
# repository. There is nothing to store or protect. Second, for exactly that reason the
# identity of the signature is the build workflow itself: anyone can verify it
# without taking our word for it.
name: publish

#
# ⚠ A release is started MANUALLY from main, not by pushing a tag:
#
#   gh workflow run publish.yml --ref main -f tag=v0.1.8
#
# The signature identity is the workflow file AND the ref it was started from:
# `publish.yml@refs/heads/main` and `publish.yml@refs/tags/v0.1.8` are different
# identities. The community index gate compares it with the entry EXACTLY, and it must
# be the same for all versions of the entry. With tag pushes every version would be signed
# by a new identity, and none would match `@refs/heads/main` in
# marketplace/index/. So the workflow always runs from main, and the tree for the
# build is taken from the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z, must already exist) or dev'
        required: false
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write        # without this no identity is issued for signing

env:
  REGISTRY: ghcr.io

jobs:
  # What to build and under which name. A release takes the tree from its tag, dev takes
  # the current main. A run not from main is rejected: the signature would belong to someone else.
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      tag: ${{ steps.pick.outputs.tag }}
      identity: ${{ steps.pick.outputs.identity }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          # A release runs only from main: the index gate checks its signature, and
          # the identity must be the same (finding 57). dev runs from any branch:
          # it is a test build for the sandbox before the tag, not a release.
          if [ "$tag" != dev ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "❌ a release runs from main, not from $GITHUB_REF"; exit 1
          fi
          echo "identity=https://github.com/${{ github.repository }}/.github/workflows/publish.yml@$GITHUB_REF" >> "$GITHUB_OUTPUT"
          if [ "$tag" = dev ]; then
            ref="$GITHUB_SHA"
          else
            git ls-remote --exit-code --tags \
              "https://github.com/${{ github.repository }}" "refs/tags/$tag" >/dev/null \
              || { echo "❌ tag $tag does not exist: tag first, then release"; exit 1; }
            ref="refs/tags/$tag"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $ref as $tag"

  # Every image is built for every node architecture from kubevirt/platforms.txt, on a
  # native runner, under the tag `<release>-<arch>`; images-index merges them into
  # one index under the release tag. oberon-run is used by the machine's volume fill
  # job: without an arm64 build, a machine on such a node got neither the ROM nor the
  # disk (finding 71).
  images:
    needs: [source, launcher-versions]
    name: images (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    # host-build: an image of which only the thin last layer is built for the node
    # architecture, while the heavy build runs on the builder's CPU
    # (oberon-web: emsdk exists only for amd64). Such an image is built on
    # amd64 for all architectures, the last layer through emulation.
    runs-on: ${{ matrix.image.host-build && 'ubuntu-latest' || matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.launcher-versions.outputs.platforms) }}
        image:
          - name: oberon-web
            file: deploy/Containerfile.web
            host-build: true
          - name: oberon-lab
            file: deploy/Containerfile
          # The language environment: Wirth's compiler without an operating system. This is
          # what langpack uses for one-off runs and the permanent service.
          - name: oberon-run
            file: deploy/Containerfile.oberon-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
        if: matrix.image.host-build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ needs.source.outputs.tag }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag-${{ matrix.platform.arch }}" >> "$GITHUB_OUTPUT"

      # The build context is impl/: both definitions copy rtl/, web/, tools/ and
      # the rest relative to it.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: impl
          file: impl/${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      # The digest is signed, not the tag: a tag can be moved to another
      # image, a digest cannot.
      - name: Sign the image
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Check that the signature actually landed
        run: |
          cosign verify \
            --certificate-identity "${{ needs.source.outputs.identity }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # ⚠ We check the CONTENTS, not the fact that a build happened.
      #
      # The serving image once shipped without the machine: risc5.wasm and oberon.dsk were
      # build products listed in .gitignore back then, and `COPY web/` copied something that
      # did not exist. (Now they are in git for GitHub Pages, and the image builds its own.) The page was served, response code 200, the size was right, and in the cluster
      # it looked like success until someone tried to open it.
      #
      # Hence the rule: after publishing, look inside and see what is there.
      - name: Check that the image has something to work with
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          case "${{ matrix.image.name }}" in
            oberon-web) want="risc5.wasm risc5.js risc5-chk.wasm risc5-chk.js bench_bounds.json oberon.dsk prom_sd.mem lab.html checks.html"
                        dir=/usr/share/nginx/html ;;
            oberon-run) want="prom.bin oberon.dsk"
                        dir=/opt/oberon/payload ;;
            *)          want=""; dir="" ;;
          esac
          [ -n "$want" ] || { echo "no content check for ${{ matrix.image.name }}"; exit 0; }
          for f in $want; do
            # --platform: an image built on amd64 for arm64 (host-build)
            # would not start at all without it, and the docker run failure would look
            # like "file missing".
            docker run --rm --platform linux/${{ matrix.platform.arch }} --entrypoint sh "$ref" -c "test -s $dir/$f" \
              || { echo "❌ the image has no $dir/$f"; exit 1; }
            echo "  ✅ $f"
          done

      - name: Summary
        run: |
          echo "### ${{ matrix.image.name }} ${{ matrix.platform.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The builds of all architectures of an image go into one index under the release tag: that is
  # what the catalog and clusters use. The index itself is signed.
  images-index:
    needs: [source, launcher-versions, images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [oberon-web, oberon-lab, oberon-run]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Index
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          tools/image-index.sh "${{ env.REGISTRY }}/$owner/paleocomputing/${{ matrix.name }}" \
            "${{ needs.source.outputs.tag }}" "${{ needs.source.outputs.tag }}"

  # ── The virt-launcher image with foreign machines ─────────────────────────────────
  #
  # The emulators in the cluster live here, not in oberon-run: that one carries only the ROM
  # and the disk. Which machines: kubevirt/targets.txt (RISC5 today). This image used to be built by hand on the test bench, and the published one lagged
  # behind the code: it lacked the chk property, although the catalog could already ask for it.
  #
  # The tag carries the KubeVirt version: the launcher must match it (finding 44).
  # So the image is built for every version from kubevirt/versions.txt
  # (finding 60); the list is taken from the release tree, not from this file.
  #
  # Two tags for one digest: `<kubevirt>-paleo-<release>` is the family name,
  # which does not change with the number of machines in the image (the platform
  # component uses it, finding 65), and the old `<kubevirt>-risc5-<release>`, so as not to
  # break those who already have it recorded in their KubeVirt resource.
  #
  # The image is multi-architecture (kubevirt/platforms.txt, finding 71): each
  # architecture is built on a native runner under its own tag
  # `<kubevirt>-paleo-<release>-<arch>`, and launcher-index merges them into one
  # index under both names above. A node picks its own build from the index.
  launcher-versions:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      versions: ${{ steps.list.outputs.versions }}
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - id: list
        run: |
          versions=$(awk '!/^#/ && NF { print $1 }' kubevirt/versions.txt | jq -Rnc '[inputs]')
          platforms=$(awk '!/^#/ && NF { print $1, $2 }' kubevirt/platforms.txt \
            | jq -Rnc '[inputs | split(" ") | {arch: .[0], runner: .[1]}]')
          [ "$versions" != "[]" ] || { echo "kubevirt/versions.txt lists no versions"; exit 1; }
          [ "$platforms" != "[]" ] || { echo "kubevirt/platforms.txt lists no architectures"; exit 1; }
          list=$(jq -nc --argjson v "$versions" --argjson p "$platforms" '[$v[] as $k | $p[] | . + {kubevirt: $k}]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  launcher:
    needs: [source, launcher-versions]
    name: launcher (${{ matrix.kubevirt }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.launcher-versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}

      # install: true so that `docker build` inside build.sh goes through buildx
      # and can do caching, provenance attestation and pushing.
      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ⚠ Without this the type=gha cache silently does not work. buildx takes the cache token
      # from ACTIONS_RUNTIME_TOKEN, and the `run` step is not given it, only the
      # actions themselves. No token, and buildx drops --cache-from/--cache-to without
      # a single word, and the build starts from scratch every time.
      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ needs.source.outputs.tag }}"
          kv="${{ matrix.kubevirt }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/virt-launcher" >> "$GITHUB_OUTPUT"
          echo "tag=$kv-paleo-$tag-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - id: build
        run: |
          set -euo pipefail
          kubevirt/build.sh --kubevirt "${{ matrix.kubevirt }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --platform linux/${{ matrix.arch }} \
            --push --provenance=true --sbom=true \
            --cache-from type=gha,scope=launcher-${{ matrix.kubevirt }}-${{ matrix.arch }} \
            --cache-to type=gha,scope=launcher-${{ matrix.kubevirt }}-${{ matrix.arch }},mode=max \
            --metadata-file /tmp/meta.json
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # The contents, not the fact of a build. The same check runs on PRs (launcher.yml).
      - name: Check the machines in the image
        run: kubevirt/check_image.sh "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Summary
        run: |
          echo "### virt-launcher ${{ matrix.kubevirt }} ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The builds of all architectures of one KubeVirt version go into one index under the names
  # that clusters use. The index is signed separately: cosign verify by
  # tag checks exactly that.
  launcher-index:
    needs: [source, launcher-versions, launcher]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubevirt: ${{ fromJSON(needs.launcher-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Index
        run: |
          set -euo pipefail
          tag="${{ needs.source.outputs.tag }}"
          kv="${{ matrix.kubevirt }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          # The old -risc5- name points at the same index, for those who have it recorded.
          tools/image-index.sh "${{ env.REGISTRY }}/$owner/paleocomputing/virt-launcher" \
            "$kv-paleo-$tag" "$kv-paleo-$tag" "$kv-risc5-$tag"

  # ── The three catalog repositories as OCI artifacts ────────────────────────────
  #
  # flux publishes them: a catalog artifact is not a container image but a snapshot
  # of a file tree, and flux is what builds it. cozypkg adds a structure check on top
  # and refuses to publish what the platform would not parse.
  #
  # Both tools are installed on the runner and live only for the duration of the build.
  catalog:
    needs: [source, launcher-index, images-index]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0     # cozypkg takes the artifact source and revision from git

      - name: Install flux
        uses: fluxcd/flux2/action@main

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # cozypkg is built from source: released binaries do not have the validate command
      # yet, and go install does not work on this module: its go.mod has
      # replace directives. The commit is pinned so that the build does not shift under
      # our feet along with someone else's branch.
      - name: Build cozypkg
        env:
          COZYSTACK_SHA: ff52aeb44e54d5e851ca18a343e7b66a15c9e571
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout             https://github.com/cozystack/cozystack.git /tmp/cozystack
          git -C /tmp/cozystack checkout --quiet "$COZYSTACK_SHA"
          ( cd /tmp/cozystack && go build -o /tmp/cozypkg ./cmd/cozypkg )
          sudo install -m755 /tmp/cozypkg /usr/local/bin/cozypkg
          cozypkg validate --help >/dev/null && echo "cozypkg built, validate is present"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      # The platform component's launcher table, pinned to THIS release's tag.
      # The job waits for launcher, so the table cannot refer to an image
      # that is not in the registry yet.
      - name: Launcher table for the release
        run: |
          python3 marketplace/tools/gen-launcher-table.py --release "${{ needs.source.outputs.tag }}" --pin
          # The images with machine files go there too: the passport must not lag behind the release.
          python3 marketplace/tools/pin-images.py --release "${{ needs.source.outputs.tag }}" --pin

      # A copy with dereferenced links is published: flux does not put links into the archive,
      # and the catalog unpacker in the cluster skips them, so a machine
      # library connected by a link would never reach the cluster.
      - name: Catalog copy without links
        run: marketplace/tools/stage.sh "$RUNNER_TEMP/catalog"

      - name: Check the catalog before publishing
        run: |
          set -euo pipefail
          for r in machines languages images platform; do
            echo "── repos/$r"
            cozypkg validate "$RUNNER_TEMP/catalog/$r"
          done

      # Our own catalog checks, on top of the standard validator. Until now they
      # lived only in the manual `make check`, and things they would have caught
      # went to the cluster.
      - name: Catalog checks
        run: |
          pip install --quiet pyyaml
          python3 marketplace/tools/check.py

      - name: Publish and sign
        run: |
          set -euo pipefail
          tag="${{ needs.source.outputs.tag }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "### Catalog" >> "$GITHUB_STEP_SUMMARY"
          for r in machines languages images platform; do
            ref="ghcr.io/$owner/paleocomputing/$r:$tag"
            # A copy outside git: we pass the source and revision ourselves, in the same form
            # cozypkg would derive them from the tree.
            cozypkg push "oci://$ref" --path "$RUNNER_TEMP/catalog/$r" \
              --source "$(git remote get-url origin)" \
              --revision "$(git describe --tags --always):$(git rev-parse HEAD)"
            # The digest is signed: cosign resolves the tag to it itself.
            cosign sign --yes "$ref"
            cosign verify \
              --certificate-identity "${{ needs.source.outputs.identity }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" >/dev/null
            echo "- \`$ref\` — published and signature verified" >> "$GITHUB_STEP_SUMMARY"
          done
