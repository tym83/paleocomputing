# Публикация образов лаборатории.
#
# Собирается и подписывается здесь, а не с чьего-то ноутбука, по двум причинам.
# Во-первых, подпись cosign делается БЕЗ КЛЮЧА: сборка получает от GitHub
# одноразовое удостоверение, им и подписывает, а запись в публичном журнале
# прозрачности фиксирует, что артефакт собран именно этим процессом в этом
# репозитории. Хранить и беречь нечего. Во-вторых, ровно поэтому личностью
# подписи становится сам процесс сборки — проверить её сможет кто угодно,
# не доверяя нам на слово.
name: publish

#
# ⚠ Выпуск запускается ВРУЧНУЮ из main, а не пушем тега:
#
#   gh workflow run publish.yml --ref main -f tag=v0.1.8
#
# Личность подписи — это файл процесса И ссылка, с которой он запущен:
# `publish.yml@refs/heads/main` и `publish.yml@refs/tags/v0.1.8` — разные
# личности. Шлюз community-индекса сверяет её с записью ТОЧНО, и она обязана
# быть одной на все версии записи. По пушу тега каждая версия подписывалась
# бы новой личностью, и ни одна не совпала бы с `@refs/heads/main` в
# marketplace/index/. Поэтому процесс всегда идёт из main, а дерево для
# сборки берётся из тега.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска (vX.Y.Z — должен уже существовать) или dev'
        required: false
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write        # без этого не выдаётся удостоверение для подписи

env:
  REGISTRY: ghcr.io

jobs:
  # Что собирать и под каким именем. Выпуск берёт дерево из своего тега, dev —
  # текущий main. Запуск не из main отвергается: подпись вышла бы чужой.
  source:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "❌ выпуск запускается из main, а не из $GITHUB_REF"; exit 1; }
          tag="${{ github.event.inputs.tag }}"
          if [ "$tag" = dev ]; then
            ref="$GITHUB_SHA"
          else
            git ls-remote --exit-code --tags \
              "https://github.com/${{ github.repository }}" "refs/tags/$tag" >/dev/null \
              || { echo "❌ тега $tag нет: сначала тег, потом выпуск"; exit 1; }
            ref="refs/tags/$tag"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "собираем $ref как $tag"

  images:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oberon-web
            file: deploy/Containerfile.web
          - name: oberon-lab
            file: deploy/Containerfile
          # Среда языка: компилятор Вирта без операционной системы. Это то,
          # что берёт langpack для разовых прогонов и постоянной службы.
          - name: oberon-run
            file: deploy/Containerfile.oberon-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ needs.source.outputs.tag }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Контекст сборки — impl/: оба описания копируют rtl/, web/, tools/ и
      # прочее относительно него.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: impl
          file: impl/${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Подписывается дайджест, а не тег: тег можно переставить на другой
      # образ, дайджест — нет.
      - name: Подписать образ
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Проверить, что подпись действительно легла
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # ⚠ Проверяем СОДЕРЖИМОЕ, а не факт сборки.
      #
      # Образ раздачи однажды вышел без машины: risc5.wasm и oberon.dsk были
      # тогда продуктами сборки в .gitignore, и `COPY web/` копировал то, чего
      # нет. (Теперь они лежат в git ради GitHub Pages, а образ собирает свои.) Страница отдавалась, код ответа 200, размер верный — и в кластере
      # это выглядело успехом, пока никто не попробовал её открыть.
      #
      # Отсюда правило: после выкладки лезть внутрь и смотреть, что там лежит.
      - name: Проверить, что в образе есть чем работать
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          case "${{ matrix.name }}" in
            oberon-web) want="risc5.wasm risc5.js risc5-chk.wasm risc5-chk.js bench_bounds.json oberon.dsk prom_sd.mem lab.html checks.html"
                        dir=/usr/share/nginx/html ;;
            oberon-run) want="prom.bin oberon.dsk"
                        dir=/opt/oberon/payload ;;
            *)          want=""; dir="" ;;
          esac
          [ -n "$want" ] || { echo "для ${{ matrix.name }} проверки содержимого нет"; exit 0; }
          for f in $want; do
            docker run --rm --entrypoint sh "$ref" -c "test -s $dir/$f" \
              || { echo "❌ в образе нет $dir/$f"; exit 1; }
            echo "  ✅ $f"
          done

      - name: Итог
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Образ virt-launcher с чужими машинами ─────────────────────────────────
  #
  # Эмуляторы в кластере живут здесь, а не в oberon-run: тот несёт только ПЗУ
  # и диск. Какие машины — kubevirt/targets.txt (сегодня RISC5). Раньше этот образ собирался руками на стенде, и выложенный отставал
  # от кода — свойства chk в нём не было, хотя каталог уже умел его просить.
  #
  # Тег несёт версию KubeVirt: launcher обязан совпадать с ней (находка 44).
  # Поэтому образ собирается под каждую версию из kubevirt/versions.txt
  # (находка 60) — список берётся из дерева выпуска, а не из этого файла.
  #
  # Тегов два на один дайджест: `<kubevirt>-paleo-<выпуск>` — имя семейства,
  # которое не меняется от того, сколько машин в образе (его берёт компонент
  # платформы, находка 65), и прежний `<kubevirt>-risc5-<выпуск>` — чтобы не
  # сломать тех, у кого он уже записан в ресурсе KubeVirt.
  launcher-versions:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - id: list
        run: |
          list=$(awk '!/^#/ && NF { print $1 }' kubevirt/versions.txt | jq -Rnc '[inputs]')
          [ "$list" != "[]" ] || { echo "в kubevirt/versions.txt нет версий"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  launcher:
    needs: [source, launcher-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kubevirt: ${{ fromJSON(needs.launcher-versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}

      # install: true — чтобы `docker build` внутри build.sh шёл через buildx
      # и умел кэш, подпись происхождения и выкладку.
      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ⚠ Без этого кэш type=gha молча не работает. buildx берёт токен кэша
      # из ACTIONS_RUNTIME_TOKEN, а шагу `run` его не дают — только самим
      # действиям. Нет токена — buildx выбрасывает --cache-from/--cache-to без
      # единого слова, и сборка каждый раз идёт с нуля.
      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ needs.source.outputs.tag }}"
          kv="${{ matrix.kubevirt }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/virt-launcher" >> "$GITHUB_OUTPUT"
          echo "tag=$kv-risc5-$tag" >> "$GITHUB_OUTPUT"
          echo "family=$kv-paleo-$tag" >> "$GITHUB_OUTPUT"

      - id: build
        run: |
          set -euo pipefail
          kubevirt/build.sh --kubevirt "${{ matrix.kubevirt }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.family }}" \
            --push --provenance=true --sbom=true \
            --cache-from type=gha,scope=launcher-${{ matrix.kubevirt }} \
            --cache-to type=gha,scope=launcher-${{ matrix.kubevirt }},mode=max \
            --metadata-file /tmp/meta.json
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)" >> "$GITHUB_OUTPUT"

      - name: Подписать образ
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # Содержимое, а не факт сборки. Та же проверка идёт на PR (launcher.yml).
      - name: Проверить машины в образе
        run: kubevirt/check_image.sh "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Итог
        run: |
          echo "### virt-launcher ${{ matrix.kubevirt }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.family }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Три репозитория каталога как OCI-артефакты ────────────────────────────
  #
  # Публикует их flux: артефакт каталога — это не образ контейнера, а слепок
  # дерева файлов, и собирает его именно он. cozypkg сверху добавляет проверку
  # структуры и отказывается публиковать то, что не разберёт платформа.
  #
  # Оба инструмента ставятся в раннер и живут только на время сборки.
  catalog:
    needs: [source, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0     # cozypkg берёт из git источник и ревизию артефакта

      - name: Поставить flux
        uses: fluxcd/flux2/action@main

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # cozypkg собирается из исходников: в выпущенных бинарях команды validate
      # ещё нет, а go install на этом модуле не работает — в его go.mod есть
      # replace-директивы. Коммит прибит гвоздями, чтобы сборка не менялась под
      # ногами вместе с чужой веткой.
      - name: Собрать cozypkg
        env:
          COZYSTACK_SHA: ff52aeb44e54d5e851ca18a343e7b66a15c9e571
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout             https://github.com/cozystack/cozystack.git /tmp/cozystack
          git -C /tmp/cozystack checkout --quiet "$COZYSTACK_SHA"
          ( cd /tmp/cozystack && go build -o /tmp/cozypkg ./cmd/cozypkg )
          sudo install -m755 /tmp/cozypkg /usr/local/bin/cozypkg
          cozypkg validate --help >/dev/null && echo "cozypkg собран, validate на месте"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      # Таблица launcher'ов компонента платформы — под тег ЭТОГО выпуска.
      # Задание ждёт launcher, так что таблица не может сослаться на образ,
      # которого ещё нет в реестре.
      - name: Таблица launcher'ов под выпуск
        run: python3 marketplace/tools/gen-launcher-table.py --release "${{ needs.source.outputs.tag }}"

      # Публикуется копия с разыменованными ссылками: flux ссылки в архив не
      # кладёт, а распаковщик каталога в кластере их пропускает — библиотека
      # машин, подключённая ссылкой, до кластера бы не доехала.
      - name: Копия каталога без ссылок
        run: marketplace/tools/stage.sh "$RUNNER_TEMP/catalog"

      - name: Проверить каталог перед публикацией
        run: |
          set -euo pipefail
          for r in machines languages images platform; do
            echo "── repos/$r"
            cozypkg validate "$RUNNER_TEMP/catalog/$r"
          done

      # Свои проверки каталога — поверх штатного валидатора. До сих пор они
      # жили только в ручном `make check`, и в кластер уезжало то, что они бы
      # поймали.
      - name: Проверки каталога
        run: |
          pip install --quiet pyyaml
          python3 marketplace/tools/check.py

      - name: Выложить и подписать
        run: |
          set -euo pipefail
          tag="${{ needs.source.outputs.tag }}"
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "### Каталог" >> "$GITHUB_STEP_SUMMARY"
          for r in machines languages images platform; do
            ref="ghcr.io/$owner/paleocomputing/$r:$tag"
            # Копия вне git: источник и ревизию передаём сами, в том же виде,
            # в каком cozypkg вывел бы их из дерева.
            cozypkg push "oci://$ref" --path "$RUNNER_TEMP/catalog/$r" \
              --source "$(git remote get-url origin)" \
              --revision "$(git describe --tags --always):$(git rev-parse HEAD)"
            # Подписывается дайджест: cosign сам разрешает тег в него.
            cosign sign --yes "$ref"
            cosign verify \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" >/dev/null
            echo "- \`$ref\` — выложен и подпись проверена" >> "$GITHUB_STEP_SUMMARY"
          done
