# The RED and GREEN episode (impl/ada-colors).
#
# red: the compiler written in RED is rebuilt from its seed twice and the two C
#   files must be identical (the fixed point); the very first step from the
#   Python bootstrap is replayed; then the tests, the NonStop kernel, the
#   Kubernetes loops and the labs run. Everything prints the same on every run:
#   the runtime follows the RED scheduler exactly and its clock is virtual.
# green: the same for the compiler written in GREEN.
# ada83: the comparison programs, built by GNAT in Ada 83 mode.
# web: the browser page (site/red/): redc, greenc and the runtime rebuilt for
#   WebAssembly must match what is committed, and every example run in headless
#   Chrome must print byte for byte what the native build prints.
# image: the ada-colors-run image for langpack is built and runs one program
#   per language, so a broken image shows up in the pull request, not at release.
name: ada-colors

on:
  push:
    branches: [main]
    paths: ['impl/ada-colors/**', 'impl/deploy/*ada-colors*', 'site/red/**', '.github/workflows/ada-colors.yml']
  pull_request:
    paths: ['impl/ada-colors/**', 'impl/deploy/*ada-colors*', 'site/red/**', '.github/workflows/ada-colors.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: impl/ada-colors

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixed point
        run: make fixpoint
      - name: Genesis (the first step, from the Python bootstrap)
        run: make genesis
      - name: Tests
        run: red/tests/run.sh
      - name: NonStop kernel and Kubernetes loops
        run: os/run.sh
      - name: Labs
        run: |
          for lab in 01 02 03 04 05 06 07 08 09 12; do labs/check.sh $lab look; done
      - name: Lab checker against reference solutions
        run: labs/verify.sh

  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixed point and tests
        run: |
          if [ -f green/Makefile ]; then make -C green fixpoint test; else echo "no green yet"; fi

  ada83:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNAT
        run: sudo apt-get update && sudo apt-get install -y gnat
      - name: Ada 83 comparison programs
        run: ada83/run.sh

  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ada-colors-run -f impl/deploy/Containerfile.ada-colors-run impl
      - name: A RED and a GREEN program
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/impl/ada-colors/labs/red:/src:ro" ada-colors-run 06-priority.red | tee red.txt
          [ "$(tr '\n' ' ' < red.txt)" = "c b a " ]
          docker run --rm -v "$PWD/impl/ada-colors/green/tests:/src:ro" ada-colors-run tasking.grn | tee green.txt
          grep -q 'sum 150' green.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native compilers, for the reference outputs
        run: make fixpoint && make -C green fixpoint
      - name: The WebAssembly build matches the repository
        working-directory: impl/ada-colors/web
        run: npm ci --no-audit --no-fund && node build.mjs --check
      - name: Every example in headless Chrome, byte for byte
        run: web/test-browser.sh
