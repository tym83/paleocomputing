# Place and route of the RISC5 core on Lattice ECP5 fabric (ULX3S) with the open
# yosys -> nextpnr-ecp5 flow, with static timing analysis.
#
# Timing here is a check, not decoration: the job fails if even one
# placement seed does not hold 25 MHz, the frequency of Wirth's original design
# (RISC5Top.v divides 50 MHz by two). An RTL change that breaks the frequency
# fails just like a change that breaks booting.
#
# Tools come from the pinned impl/fpga/Dockerfile image; see impl/fpga/results.md.
name: fpga

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'impl/rtl/**'
      - 'impl/fpga/**'
      - '.github/workflows/fpga.yml'
  pull_request:
    paths:
      - 'impl/rtl/**'
      - 'impl/fpga/**'
      - '.github/workflows/fpga.yml'

permissions:
  contents: read

jobs:
  ecp5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools image
        run: make docker-image
        working-directory: impl/fpga

      - name: Tool versions
        run: |
          docker run --rm paleo-fpga:local sh -c \
            'yosys -V; nextpnr-ecp5 --version; openFPGALoader -V; dpkg-query -W fpga-trellis'

      # Three cores (base, chk, desc) x two wrappers (soc, core) x five seeds.
      # make all fails if even one seed is below 25 MHz.
      - name: Synthesis, placement, timing
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/impl/fpga \
            paleo-fpga:local make all

      # Packing into a bitstream checks that the result builds into a board
      # file at all. The wrapper bitstream does not boot the system.
      - name: Bitstream (packing check)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/impl/fpga \
            paleo-fpga:local make bit WRAP=soc VARIANT=chk

      - name: Summary
        if: always()
        run: cat impl/fpga/build/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpga-timing-reports
          path: |
            impl/fpga/build/summary.md
            impl/fpga/build/*/timing.json
            impl/fpga/build/*/stat.txt
            impl/fpga/build/*/synth.log
            impl/fpga/build/*/seed*/report.json
            impl/fpga/build/*/seed*/pnr.log
          if-no-files-found: warn
