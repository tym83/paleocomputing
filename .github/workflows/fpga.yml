# Размещение и трассировка ядра RISC5 на ткани Lattice ECP5 (ULX3S) открытым
# потоком yosys -> nextpnr-ecp5, со статическим анализом тайминга.
#
# Тайминг здесь — проверка, а не украшение: задание падает, если хоть одно
# зерно размещения не держит 25 МГц — частоту исходного дизайна Вирта
# (RISC5Top.v делит 50 МГц пополам). Правка RTL, которая ломает частоту,
# не проходит так же, как правка, которая ломает загрузку.
#
# Инструменты — из прибитого образа impl/fpga/Dockerfile; см. impl/fpga/results.md.
name: fpga

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'impl/rtl/**'
      - 'impl/fpga/**'
      - '.github/workflows/fpga.yml'
  pull_request:
    paths:
      - 'impl/rtl/**'
      - 'impl/fpga/**'
      - '.github/workflows/fpga.yml'

permissions:
  contents: read

jobs:
  ecp5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Образ инструментов
        run: make docker-image
        working-directory: impl/fpga

      - name: Версии инструментов
        run: |
          docker run --rm paleo-fpga:local sh -c \
            'yosys -V; nextpnr-ecp5 --version; openFPGALoader -V; dpkg-query -W fpga-trellis'

      # Три ядра (base, chk, desc) x две обёртки (soc, core) x пять зёрен.
      # make all завершается с ошибкой, если хоть одно зерно ниже 25 МГц.
      - name: Синтез, размещение, тайминг
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/impl/fpga \
            paleo-fpga:local make all

      # Упаковка в битстрим — проверка, что результат вообще собирается в
      # файл для платы. Битстрим обёртки систему не загружает.
      - name: Битстрим (проверка упаковки)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work -w /work/impl/fpga \
            paleo-fpga:local make bit WRAP=soc VARIANT=chk

      - name: Сводка
        if: always()
        run: cat impl/fpga/build/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpga-timing-reports
          path: |
            impl/fpga/build/summary.md
            impl/fpga/build/*/timing.json
            impl/fpga/build/*/stat.txt
            impl/fpga/build/*/synth.log
            impl/fpga/build/*/seed*/report.json
            impl/fpga/build/*/seed*/pnr.log
          if-no-files-found: warn
