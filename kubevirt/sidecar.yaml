# Example: a RISC5 virtual machine in Cozystack through a KubeVirt hook.
#
# ⚠ This is a sketch, not a working manifest: it has no machine descriptor
# (the paleocomputing.io/machine annotation), without which the hook refuses,
# and no volume filling. The working path is the oberon-vm chart, see
# kubevirt/GUIDE.md.
#
# No KubeVirt fork is needed. The hook is a supported extension point: a
# third-party container receives the domain description before launch and
# returns a modified one. Here it is supplied as a script in a ConfigMap, so no
# hook image of its own is needed either; the stock sidecar-shim wrapper is used.
#
# ⚠ Two conditions are required on the cluster side:
#   1. the Sidecar feature gate is enabled in the KubeVirt resource:
#        spec.configuration.developerConfiguration.featureGates: [Sidecar]
#   2. the virt-launcher image is built with a libvirt that knows the risc5
#      architecture (the patch from qemu/libvirt/, ~6 lines). It is switched by
#      the imageRegistry setting on the KubeVirt resource, so no Cozystack fork
#      is needed either.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: risc5-hook
data:
  # The key name does not matter; what matters is hookPath in the declaration below.
  onDefineDomain: |
    PASTE-THE-CONTENTS-OF-onDefineDomain.py-HERE
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: oberon
  annotations:
    # The volume with the emulator and images is mounted BOTH into the hook AND
    # into the container where libvirt runs; sharedComputePath takes care of that.
    hooks.kubevirt.io/hookSidecars: |
      [{
        "args": ["--version", "v1alpha2"],
        "configMap": {
          "name": "risc5-hook",
          "key": "onDefineDomain",
          "hookPath": "/usr/bin/onDefineDomain"
        },
        "pvc": {
          "name": "risc5-payload",
          "volumePath": "/payload",
          "sharedComputePath": "/payload"
        }
      }]
spec:
  domain:
    # The hook replaces these values anyway; KubeVirt requires them to build
    # the description that we then rewrite.
    resources:
      requests:
        memory: 128Mi
    devices: {}
  volumes: []
