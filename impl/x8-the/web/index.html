<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE on the X8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
  .machine { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-top: 1.5rem; }
  @media (min-width: 60rem) { .machine { grid-template-columns: 3fr 2fr; } .sheet.wide { max-width: 76rem; } }
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0.9rem 1rem; min-width: 0; }
  .panel h2 { font-family: var(--f-display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
              color: var(--grey); margin: 0 0 0.6rem; font-weight: 500; }
  pre.paper { font-family: var(--f-mono); font-size: 0.82rem; line-height: 1.45; margin: 0; white-space: pre-wrap;
              word-break: break-word; overflow-y: auto; max-height: 22rem; min-height: 8rem; }
  #lp { max-height: 18rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; font-family: var(--f-display); font-size: 0.9rem; }
  .controls button, .controls select, .keys input, .keys button {
    font: inherit; padding: 0.35rem 0.7rem; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--ground); color: var(--ink); }
  .controls button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .keys { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .keys input { flex: 1; min-width: 0; font-family: var(--f-mono); }
  .stats { font-family: var(--f-mono); font-size: 0.82rem; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 1rem; }
  table.pages { width: 100%; border-collapse: collapse; font-family: var(--f-mono); font-size: 0.8rem; margin-top: 0.7rem; }
  table.pages th, table.pages td { text-align: left; padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--rule-soft); }
  table.pages th { font-family: var(--f-display); font-weight: 500; color: var(--grey); }
  .holy { color: var(--red); }
  .coming { color: var(--blue); }
  .muted { color: var(--grey); }
  .note { font-size: 0.95rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="sheet wide">
  <header class="masthead">
    <p class="eyebrow">Paleocomputing · <a id="other" href="?lang=ru">Русский</a></p>
    <h1 id="h1">THE on the Electrologica X8</h1>
    <p id="lead" class="note"></p>
  </header>

  <div class="controls">
    <button id="start" class="primary"></button>
    <label><span id="speedlabel"></span>
      <select id="speed">
        <option value="1">1×</option>
        <option value="10">10×</option>
        <option value="100">100×</option>
        <option value="0">max</option>
      </select>
    </label>
    <span id="state" class="muted"></span>
  </div>

  <div class="machine">
    <div>
      <section class="panel">
        <h2 id="consoleh"></h2>
        <pre id="console" class="paper"></pre>
        <form class="keys" id="keys">
          <input id="line" autocomplete="off" spellcheck="false">
          <button id="send" type="submit"></button>
        </form>
      </section>
      <section class="panel" style="margin-top:1.25rem">
        <h2 id="lph"></h2>
        <pre id="lp" class="paper"></pre>
      </section>
    </div>
    <section class="panel">
      <h2 id="coreh"></h2>
      <div class="stats" id="stats"></div>
      <table class="pages" id="pages"></table>
      <p id="legend" class="note"></p>
    </section>
  </div>
</div>
<script src="x8.js"></script>
<script src="x8page.js"></script>
</body>
</html>
