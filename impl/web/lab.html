<!doctype html>
<meta charset="utf-8">
<title data-i18n-en="Labs: Oberon on real Verilog">Лаборатории: Оберон на настоящем Verilog</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1a1a1a; --mut:#666;
          --line:#d8d8d4; --ok:#1a7f37; --no:#a33; --acc:#2b5fa8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --mut:#9aa0a6; --line:#2e3238;
            --ok:#4ec36e; --no:#e06c6c; --acc:#7aa7e8; } }
  * { box-sizing: border-box }
  /* Full-height layout: the header and the screen stay in place, only the task
     column scrolls. Otherwise the "Check" button scrolls up together with what
     it asks you to verify by eye. */
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5
         ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; overflow:hidden }
  header { flex:none }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; flex-wrap:wrap }
  header h1 { font-size:15px; margin:0; font-weight:600 }
  select, button { font:inherit; padding:5px 10px; border:1px solid var(--line);
                   border-radius:6px; background:transparent; color:inherit; cursor:pointer }
  button:hover { border-color:var(--acc) }
  main { flex:1; min-height:0; display:grid;
         grid-template-columns:minmax(0,1fr) 380px; gap:16px; padding:16px }
  .panel { min-height:0; overflow-y:auto; padding-right:4px }
  /* The screen is pinned and the task column scrolls: otherwise the "Check" button
     scrolls up together with what has to be verified by eye. */
  .stage { position:sticky; top:12px; align-self:start }
  /* Never scale beyond the natural size: the machine's screen is 1024x768, and at
     1:1 a machine pixel maps onto a screen pixel, so text is sharp. A stretched
     canvas is both larger than needed and blurry at a non-integer scale. */
  /* The machine's screen is 1024x768. At 1:1 its pixel maps onto a screen pixel and
     text is sharpest; an integer 2x zoom is sharp too, intermediate ones blur, so
     they are labelled honestly. The screen does not have to fit the window: at a
     large zoom the column scrolls. */
  /* The machine's screen is 1024x768. The "fit" mode scales it to the column (may
     blur slightly at a non-integer scale), the others give an exact size, and if it
     is larger than the column, the screen frame itself scrolls, not the page. */
  .stage { --k:1; min-width:0; min-height:0; overflow:auto }
  /* ⚠ The size is set on the MACHINE ITSELF, not on the canvas: the canvas lives in
     the component's shadow tree, which page styles cannot reach. */
  oberon-machine { display:block; border:1px solid var(--line); background:#fff;
                   margin:0 auto; width:calc(1024px * var(--k)); max-width:none }
  .stage.fit oberon-machine { width:100%; max-width:100% }

  /* On a narrow screen the columns collapse and there is nothing to hold everything
     in place: fall back to ordinary page scrolling. */
  @media (max-width:1100px) {
    html, body { height:auto }
    body { overflow:visible; display:block }
    main { display:block; min-height:0 }
    .panel, .stage { overflow:visible; min-height:0 }
    .stage.fit oberon-machine { width:100% }
  }
  .panel > section { border:1px solid var(--line); border-radius:8px; padding:12px;
                     margin-bottom:12px }
  .intro { color:var(--mut) }
  ol { padding-left:22px; margin:0 }
  li { margin:0 0 14px }
  li.done::marker { color:var(--ok) }
  .res { margin-top:6px; font-size:13px }
  .res.ok { color:var(--ok) } .res.no { color:var(--no) }
  code { font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
         background:color-mix(in srgb, var(--fg) 8%, transparent); padding:1px 4px; border-radius:3px }
  .stat { font:12px ui-monospace,Menlo,monospace; color:var(--mut) }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px }
  input { font:12px ui-monospace,Menlo,monospace; width:96px; padding:4px 6px;
          border:1px solid var(--line); border-radius:5px; background:transparent; color:inherit }
  .hint { color:var(--mut); font-size:13px }
  .payoff-box { border-left:2px solid var(--acc) }
  .payoff-h { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--acc); margin:0 0 6px }
  #payoff { font-size:13.5px; line-height:1.55 }
  #payoff ul { margin:6px 0 0 -18px }
  pre.want { background:color-mix(in srgb, var(--fg) 7%, transparent); padding:8px 10px; overflow-x:auto;
             font:11px/1.45 ui-monospace,Menlo,monospace; margin:8px 0 }
</style>

<header>
  <h1 data-i18n-en="Labs · Oberon on real Verilog">Лаборатории · Оберон на настоящем Verilog</h1>
  <select id="pick"></select>
  <a href="book/index.html" id="bookLink" style="color:var(--acc)" data-i18n-en="Handbook">Методичка</a>
  <button id="reset" data-i18n-en="Reset">Откатить</button>
  <button id="pause" data-i18n-en="Pause">Пауза</button>
  <label class="stat"><span data-i18n-en="mouse">мышь</span>
    <select id="btn">
      <option value="4" data-i18n-en="left — places the caret">левая — ставит курсор</option>
      <option value="2" data-i18n-en="middle — runs">средняя — запускает</option>
      <option value="1" data-i18n-en="right — selects">правая — выделяет</option>
    </select>
  </label>
  <label class="stat"><span data-i18n-en="language">язык</span>
    <select id="lang"></select>
  </label>
  <label class="stat"><span data-i18n-en="zoom">масштаб</span>
    <select id="zoom">
      <option value="fit" data-i18n-en="fit to window">вписать в окно</option>
      <option value="1" data-i18n-en="1:1 — sharp">1:1 — резко</option>
      <option value="1.25">1,25×</option>
      <option value="1.5">1,5×</option>
      <option value="2" data-i18n-en="2× — large">2× — крупно</option>
    </select>
  </label>
  <span class="stat" id="stat" title="Сколько команд выполнил процессор; адрес выполняемой сейчас команды; меняется ли картинка" data-i18n-en="loading…">загрузка…</span>
</header>

<main>
  <div class="stage"><oberon-machine id="cv" autostart></oberon-machine></div>
  <div class="panel">
    <section>
      <b id="title"></b> <span class="stat" id="level"></span>
      <div class="intro" id="intro"></div>
      <div class="row" id="read"></div>
    </section>
    <section id="toolbox" hidden>
      <b data-i18n-en="Write straight into memory">Писать прямо в память</b>
      <div class="intro" data-i18n-en="No permission check, no trap: the machine has no such thing.">Ни проверки прав, ни ловушки — машина такого не умеет.</div>
      <div class="row">
        <span data-i18n-en="address">адрес</span> <input id="adr" value="E7F00"> <span data-i18n-en="value">значение</span> <input id="val" value="FFFFFFFF">
        <button id="poke" data-i18n-en="Write">Вписать</button>
      </div>
      <div class="row stat"><span data-i18n-en="program counter:">счётчик команд:</span> <b id="pc">—</b></div>
    </section>
    <section>
      <ol id="steps"></ol>
    </section>
    <section class="payoff-box"><h2 class="payoff-h" data-i18n-en="What this is about">В чём тут дело</h2>
      <div id="payoff"></div></section>
    <section><div class="hint" id="hint"></div></section>
  </div>
</main>

<script type="module">
import { labelAltKeys, ALT_LABEL } from './machine.js';
import './embed.js';
import { LANG, LANGS, setLang, applyMarkup } from './i18n.js';
import { LABS } from './labs.js';

const $ = id => document.getElementById(id);
const hex = n => (n >>> 0).toString(16).toUpperCase();

// Language: English by default, Russian on request. The choice is remembered,
// and `?lang=ru` in the URL overrides the remembered one.
applyMarkup(document);
if (LANG !== 'ru') $('stat').title = 'Instructions executed by the processor; address of the instruction running now; whether the picture is changing';
LANGS_FILL();
// The handbook link in the header goes to the same place, in the right language.
if (LANG !== 'ru') {
  const bl = $('bookLink');
  if (bl) bl.href = `book/${LANG}/index.html`;
}
function LANGS_FILL() {
  const sel = $('lang');
  if (!sel) return;
  for (const [code, name] of Object.entries(LANGS)) {
    const o = document.createElement('option');
    o.value = code; o.textContent = name; o.selected = (code === LANG);
    sel.append(o);
  }
  sel.onchange = e => setLang(e.target.value);
}

/*
 * The machine runs in a separate thread (see embed.js): the lab is a page with
 * text, forms and checks, and the emulator must not take its main thread away.
 * Task checks read registers and memory, so they run THERE, next to the machine,
 * and only the verdict comes back here.
 */
const m = $('cv');
if (LANG === 'ru') m.setAttribute('start-label', 'Запустить машину');

let lab = LABS[0];

LABS.forEach((l, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = `${l.id}. ${l.title} — ${l.level}`;
  $('pick').append(o);
});

function render() {
  $('title').textContent = lab.title;
  $('level').textContent = '· ' + lab.level;
  $('intro').innerHTML = lab.intro;
  $('hint').innerHTML = (LANG === 'ru' ? '<b>Подсказка.</b> ' : '<b>Hint.</b> ') + lab.hint;
  $('payoff').innerHTML = lab.payoff || '';
  document.querySelector('.payoff-box').hidden = !lab.payoff;
  $('toolbox').hidden = lab.tools !== 'poke';
  // Modifier key labels depend on the OS, and the markup arrives as a string from
  // labs.js, so we fill them in after every redraw.
  labelAltKeys(document);
  $('read').innerHTML = (lab.read || [])
    // English chapters live in a separate directory, so styling and links stay
    // relative within each language.
    .map(([f, t]) => `<a href="book/${LANG === 'ru' ? '' : LANG + '/'}${f}">📖 ${t}</a>`).join(' · ');
  $('steps').innerHTML = '';
  lab.steps.forEach((st, i) => {
    const li = document.createElement('li');
    li.innerHTML = st.text;
    const b = document.createElement('button');
    b.textContent = LANG === 'ru' ? 'Проверить' : 'Check';
    const res = document.createElement('div');
    res.className = 'res';
    let inp = null;
    if (st.answer) {
      inp = document.createElement('input');
      inp.placeholder = st.answer;
      inp.style.width = '150px';
    }
    b.onclick = async () => {
      const r = await m.check(lab.id, i, inp ? inp.value : '');
      res.className = 'res ' + (r.ok ? 'ok' : 'no');
      res.textContent = (r.ok ? '✅ ' : '— ') + r.msg;
      li.classList.toggle('done', r.ok);
    };
    const row = document.createElement('div');
    row.className = 'row';
    if (inp) row.append(inp);
    row.append(b);
    li.append(row, res);
    $('steps').append(li);
  });
}

// The machine for the lab. Most need the stock processor and the reference disk;
// a lab that needs different hardware or a file beyond the reference declares it
// in the `machine` field, and the machine is brought up anew, as on checks.html.
function applyMachine(l) {
  const want = l.machine || {};
  m.setAttribute('variant', want.variant || 'base');
  if (want.files && want.files.length) m.setAttribute('files', want.files.join(' '));
  else m.removeAttribute('files');
}
applyMachine(lab);
$('pick').onchange = e => { lab = LABS[+e.target.value]; applyMachine(lab); m.forget(lab.id); render(); };
// Screen zoom. The choice is remembered: people set it once.
const stage = document.querySelector('.stage'), zoom = $('zoom');
function applyZoom(k) {
  const fit = (k === 'fit');
  stage.classList.toggle('fit', fit);
  if (!fit) stage.style.setProperty('--k', k);
}
try {
  const saved = localStorage.getItem('oberon-zoom');
  if (saved && [...zoom.options].some(o => o.value === saved)) zoom.value = saved;
} catch (e) { /* private window: just stay at 1:1 */ }
applyZoom(zoom.value);
zoom.onchange = () => {
  applyZoom(zoom.value);
  try { localStorage.setItem('oberon-zoom', zoom.value); } catch (e) {}
};

// Button switch: a trackpad has no middle button, and there is no right-button drag.
$('btn').onchange = e => m.setButton(+e.target.value);

$('reset').onclick = () => { m.reset(); m.forget(lab.id); render(); };
$('pause').onclick = () => {
  const ru = LANG === 'ru';
  if (m.running) { m.stop(); $('pause').textContent = ru ? 'Пуск' : 'Run'; }
  else { m.start(); $('pause').textContent = ru ? 'Пауза' : 'Pause'; }
};
$('poke').onclick = () => {
  const a = parseInt($('adr').value, 16), v = parseInt($('val').value, 16);
  if (Number.isNaN(a) || Number.isNaN(v)) return;
  m.poke(a, v);
};

render();

// State arrives together with the frame: there is no separate polling of the machine
// any more, since asking it across the thread boundary would be needed on every tick.
let lastCrc = -1;
m.addEventListener('oberon-frame', e => {
  const d = e.detail;
  const drawing = d.crc !== lastCrc; lastCrc = d.crc;
  $('stat').textContent =
    (LANG === 'ru'
      ? `${(d.insns / 1e6).toFixed(1)} млн команд · адрес ${hex(d.pc)} · экран ${drawing ? 'меняется' : 'замер'}`
      : `${(d.insns / 1e6).toFixed(1)}M instructions · at ${hex(d.pc)} · screen ${drawing ? 'changing' : 'still'}`);
  $('pc').textContent = hex(d.pc);
});
// The module ran to the end: the in-browser smoke test sees this.
document.documentElement.dataset.scriptOk = '1';
</script>
