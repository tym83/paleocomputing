# A lab as a cluster job.
#
# The idea: the browser labs (1–9) need nothing but the page, while the ones
# that change the processor or the compiler need tooling: verilator, a build
# toolchain, tests. That is an ordinary batch workload: submit a change, get a
# verdict. Exactly the kind of thing that is convenient to run as a job rather
# than keep on your own machine.
#
# The student's change is supplied as a ConfigMap: key names are paths in the
# project tree with dots instead of slashes (a ConfigMap restriction on key
# names), and an initContainer lays them back out.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oberon-lab-work
data:
  # example: a modified processor description
  rtl.RISC5.v: |
    // the change goes here; an empty key means a run on the original tree
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oberon-lab-isa
  labels:
    app.kubernetes.io/name: oberon-lab
    app.kubernetes.io/component: isa
spec:
  backoffLimit: 0                 # a lab verdict; retrying is pointless
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      initContainers:
        - name: unpack
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for k in /cm/*; do
                [ -f "$k" ] || continue
                n=$(basename "$k")
                # a key like rtl.RISC5.v -> path rtl/RISC5.v: the first dot is the
                # directory separator, the rest belong to the file name
                dir=${n%%.*}; file=${n#*.}
                mkdir -p "/work/$dir"
                cp "$k" "/work/$dir/$file"
              done
              ls -R /work
          volumeMounts:
            - { name: cm,   mountPath: /cm }
            - { name: work, mountPath: /work }
      containers:
        - name: lab
          image: ghcr.io/REPLACE-ME/oberon-lab:dev
          args: ["isa"]
          volumeMounts:
            - { name: work, mountPath: /work, readOnly: true }
          resources:
            requests: { cpu: "1",   memory: "1Gi" }
            limits:   { cpu: "2",   memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # verilator writes to build/
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: cm
          configMap: { name: oberon-lab-work }
        - name: work
          emptyDir: {}
